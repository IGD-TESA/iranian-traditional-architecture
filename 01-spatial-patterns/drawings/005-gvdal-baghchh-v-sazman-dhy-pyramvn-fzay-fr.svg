<title id="ttl">گودال‌باغچه و سازمان‌دهی پیرامون فضای فرورفته — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی گودال‌باغچه و سازمان‌دهی پیرامون فضای فرورفته در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
