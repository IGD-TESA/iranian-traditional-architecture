<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1030" viewBox="0 0 1420 1030" role="img" aria-labelledby="t d">
<title id="t">الگوی چهارایوانی؛ مسجد جامع اصفهان، دیاگرام جایگاه و ابعاد ثبت‌شده</title>
<desc id="d">دیاگرام موردی مسجد جامع اصفهان بر پایهٔ پروندهٔ ثبت جهانی یونسکو و پروندهٔ مستند کیس. چهار ایوان در چهار جهت اصلی صحن قرار دارند. ابعاد صحن ۶۰ در ۷۰ متر؛ ایوان شرقی و غربی هرکدام حدود ۱۰٫۵ در ۱۰٫۵ متر؛ ایوان جنوبی حدود ۱۲ در ۱۲ متر. ابعاد ایوان شمالی در وضع تاریخی اولیه از سند فعلی تعیین نشده و صورت آن پس از ۱۹۳۴ دگرگون و بازسازی شده است. دیاگرام جایگاه شماتیک است، نه نقشهٔ برداشت‌شده و مقیاس‌دار.</desc>
<defs>
 <style>
  .bg{fill:#f8f7f3}.panel{fill:#fff;stroke:#c8c4ba;stroke-width:2}
  .title{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:29px;font-weight:700;fill:#20282d}
  .subtitle{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#4d5960}
  .head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:21px;font-weight:700;fill:#2c383e}
  .body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}
  .small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#59656b}
  .tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#6c757a}
  .iwan{fill:#e6ecee;stroke:#35434a;stroke-width:2.5}
  .court{fill:#f2efe6;stroke:#5e6058;stroke-width:3}
  .unknown{fill:#fbfaf7;stroke:#8b7155;stroke-width:2;stroke-dasharray:8 6}
  .line{stroke:#48565c;stroke-width:1.5;fill:none}
 </style>
</defs>
<rect class="bg" width="1420" height="1030"/>
<rect x="30" y="25" width="1360" height="100" rx="10" fill="#293940"/>
<text x="710" y="66" text-anchor="middle" direction="rtl" class="title" style="fill:#fff">الگوی چهارایوانی — مسجد جامع اصفهان</text>
<text x="710" y="98" text-anchor="middle" direction="rtl" class="subtitle" style="fill:#e2e8eb">دیاگرامِ جایگاه چهار ایوان و ثبت جداگانهٔ ابعاد؛ نه بازسازی کامل پلان تاریخی</text>

<!-- RELATIONAL PLAN -->
<rect x="35" y="150" width="820" height="735" rx="9" class="panel"/>
<text x="445" y="190" text-anchor="middle" direction="rtl" class="head">۱ ـ جایگاه ایوان‌ها پیرامون صحن</text>
<text x="445" y="218" text-anchor="middle" direction="rtl" class="small">چهار جهت اصلی؛ رابطهٔ فضایی شماتیک و فاقد مقیاس ترسیمی</text>
<!-- cardinal directions -->
<text x="445" y="254" text-anchor="middle" class="small">شمال ↑</text>
<rect x="320" y="278" width="250" height="85" rx="7" class="unknown"/>
<text x="445" y="311" text-anchor="middle" direction="rtl" class="head">صفهٔ درویش</text>
<text x="445" y="338" text-anchor="middle" direction="rtl" class="small">ایوان شمالی؛ صورت کنونی دگرگون/بازسازی‌شده</text>
<!-- west / east iwans -->
<rect x="100" y="485" width="165" height="105" rx="7" class="iwan"/>
<text x="182" y="524" text-anchor="middle" direction="rtl" class="head">صفهٔ استاد</text>
<text x="182" y="553" text-anchor="middle" direction="rtl" class="small">غربی</text>
<rect x="625" y="485" width="165" height="105" rx="7" class="iwan"/>
<text x="707" y="524" text-anchor="middle" direction="rtl" class="head">صفهٔ شاگرد</text>
<text x="707" y="553" text-anchor="middle" direction="rtl" class="small">شرقی</text>
<!-- courtyard -->
<rect x="285" y="390" width="320" height="300" rx="3" class="court"/>
<text x="445" y="515" text-anchor="middle" direction="rtl" class="head">صحن مرکزی</text>
<text x="445" y="552" text-anchor="middle" class="body">۶۰ × ۷۰ متر</text>
<text x="445" y="581" text-anchor="middle" direction="rtl" class="small">ابعاد گزارش‌شده در پروندهٔ یونسکو</text>
<text x="445" y="623" text-anchor="middle" direction="rtl" class="tiny">محور شمالی ـ جنوبی، محور قبله است.</text>
<!-- South -->
<rect x="320" y="716" width="250" height="112" rx="7" class="iwan"/>
<text x="445" y="757" text-anchor="middle" direction="rtl" class="head">صفهٔ صاحب</text>
<text x="445" y="785" text-anchor="middle" direction="rtl" class="small">ایوان جنوبی / جبههٔ قبله</text>
<text x="445" y="810" text-anchor="middle" direction="rtl" class="tiny">پوشش با عنوان Taq-e Dozd در پرونده</text>
<text x="445" y="858" text-anchor="middle" direction="rtl" class="small">جنوب ↓ قبله</text>
<!-- Connecting directions labels -->
<path d="M445 363V390 M265 538H285 M605 538H625 M445 690V716" class="line"/>

<!-- DATA PANELS -->
<rect x="885" y="150" width="500" height="735" rx="9" class="panel"/>
<text x="1135" y="190" text-anchor="middle" direction="rtl" class="head">۲ ـ داده‌های مستقل هر ایوان</text>

<rect x="920" y="225" width="430" height="125" rx="7" fill="#eef2f3" stroke="#b7c2c6"/>
<text x="950" y="260" class="head" direction="rtl">ایوان شرقی — صفهٔ شاگرد</text>
<text x="950" y="294" class="body" direction="rtl">پلان: حدود ۱۰٫۵ × ۱۰٫۵ متر</text>
<text x="950" y="326" class="small" direction="rtl">پوشش در پرونده: قوس/طاق گهواره‌ای؛ تغییرات تاریخی دارد.</text>

<rect x="920" y="370" width="430" height="125" rx="7" fill="#eef2f3" stroke="#b7c2c6"/>
<text x="950" y="405" class="head" direction="rtl">ایوان غربی — صفهٔ استاد</text>
<text x="950" y="439" class="body" direction="rtl">پلان: حدود ۱۰٫۵ × ۱۰٫۵ متر</text>
<text x="950" y="471" class="small" direction="rtl">پوشش گهواره‌ای؛ تزئینات و مرمت صفوی بر صورت آن اثر گذاشته‌اند.</text>

<rect x="920" y="515" width="430" height="145" rx="7" fill="#f3eee5" stroke="#cbbda8"/>
<text x="950" y="550" class="head" direction="rtl">ایوان جنوبی — صفهٔ صاحب</text>
<text x="950" y="584" class="body" direction="rtl">پلان: حدود ۱۲ × ۱۲ متر</text>
<text x="950" y="616" class="small" direction="rtl">عنوان پوشش در منبع: Taq-e Dozd؛ مقطع قوسیِ حدسی ترسیم نمی‌شود.</text>
<text x="950" y="642" class="tiny" direction="rtl">محور ایوان جنوبی با جهت قبله منطبق است.</text>

<rect x="920" y="680" width="430" height="165" rx="7" class="unknown"/>
<text x="950" y="715" class="head" direction="rtl">ایوان شمالی — صفهٔ درویش</text>
<text x="950" y="749" class="body" direction="rtl">ابعاد و صورت تاریخی اولیه: در داده‌های فعلی تعیین نشده</text>
<text x="950" y="783" class="small" direction="rtl">بخش مهمی از نمای پیشین پس از ۱۹۳۴ باقی نمانده؛ وضع کنونی</text>
<text x="950" y="808" class="small" direction="rtl">شامل بازسازی است و نباید به‌عنوان فرم سلجوقی ترسیم شود.</text>
<text x="950" y="832" class="tiny" direction="rtl">کادر خط‌چین فقط محل ایوان را نشان می‌دهد، نه ابعاد آن را.</text>

<rect x="35" y="910" width="1350" height="85" rx="8" fill="#eeeae1" stroke="#c9c1b3"/>
<text x="710" y="943" text-anchor="middle" direction="rtl" class="small">صحن ۶۰×۷۰ متر و چهار ایوان در چهار جهت اصلی: پروندهٔ ثبت جهانی یونسکو، شمارهٔ ۱۳۹۷.</text>
<text x="710" y="970" text-anchor="middle" direction="rtl" class="tiny">ابعاد ایوان‌های شرقی/غربی/جنوبی و محدودیت ایوان شمالی: Nomination of Masjed-e Jāme’ of Isfahan (2011)، صفحات چاپی ۳۲–۴۳؛ پروندهٔ کیس مخزن.</text>
</svg>