<title id="ttl">الگوی متقارن و نامتقارن — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی الگوی متقارن و نامتقارن در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
