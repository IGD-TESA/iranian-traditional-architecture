<rect x="75" y="110" width="210" height="220" rx="0" fill="#fff" stroke="#252525" stroke-width="2"/><rect x="355" y="110" width="210" height="220" rx="0" fill="#fff" stroke="#252525" stroke-width="2"/><rect x="120" y="160" width="120" height="120" rx="0" fill="#d9e7ee" stroke="#252525" stroke-width="1.5"/><rect x="400" y="160" width="120" height="120" rx="0" fill="#d9e7ee" stroke="#252525" stroke-width="1.5"/><path d="M285 220 H355" fill="none" stroke="#285b78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
