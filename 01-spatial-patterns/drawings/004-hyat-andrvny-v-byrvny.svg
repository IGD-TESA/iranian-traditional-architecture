<title id="ttl">حیاط اندرونی و بیرونی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی حیاط اندرونی و بیرونی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
