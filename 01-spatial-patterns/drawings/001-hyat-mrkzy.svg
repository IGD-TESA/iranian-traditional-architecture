<!-- courtyard open void -->
<path d="M765 545 L865 500 L1028 543 L925 590 Z" fill="#e9f0ed" stroke="#7d9690" stroke-width="2"/>
<rect x="866" y="530" width="58" height="24" fill="#bad0d1" stroke="#647f80" stroke-width="1.5" transform="skewY(14)"/>
<!-- room blocks around void -->
<path d="M700 565 L765 545 L765 490 L700 510 Z" fill="#d8cdb9" stroke="#282824" stroke-width="2"/>
