<path d="M925 590 L1028 543 L1028 585 L925 635 Z" fill="#d8cdb9" stroke="#282824" stroke-width="2"/>
<path d="M765 545 L865 500 L865 455 L765 500 Z" fill="#d8cdb9" stroke="#282824" stroke-width="2"/>
<text x="885" y="675" text-anchor="middle" class="small">فضاهای پیرامونی، حیاط و لبه‌های نیمه‌باز در یک خوانش حجمی</text>

<text x="600" y="770" text-anchor="middle" class="small">سطح اعتبار: T1 بازسازی گونه‌شناختی | بدون ابعاد و مقیاس | منبع: Zolfagharkhani &amp; Ostwald, Buildings 11(6), 262 (2021), Fig. 1؛ Zolfagharkhani &amp; Foruzanmehr, Buildings 14(9), 2639 (2024)</text>
</svg>