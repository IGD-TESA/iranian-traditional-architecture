<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">حیاط مرکزی در خانهٔ سنتی ایران؛ بازسازی گونه‌شناختی</title>
<desc id="desc">سه بازنمایی مکمل شامل پلان تحلیلی خانهٔ حیاط‌دار، مقطع از اتاق و فضای نیمه‌باز تا حیاط، و آکسونومتری باز. این تصویر ترکیبی و غیرمقیاس‌دار است و پلان برداشت‌شدهٔ یک بنای مشخص نیست. بر پایهٔ مطالعات خانه‌های حیاط‌دار یزد.</desc>
<defs>
 <style>
  .wall{fill:#eee9df;stroke:#282824;stroke-width:7;stroke-linejoin:miter}
  .inner{fill:#f8f6f0;stroke:#282824;stroke-width:4}
  .open{fill:#fff;stroke:#282824;stroke-width:2}
  .fine{fill:none;stroke:#4b4b45;stroke-width:2}
  .dim{fill:none;stroke:#9a8b73;stroke-width:1.6;stroke-dasharray:5 5}
  .label{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#282824;font-size:18px}
  .small{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#57564f;font-size:14px}
  .head{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#272722;font-size:22px;font-weight:700}
  .panel{fill:#fbfaf7;stroke:#cfc8bc;stroke-width:1.5}
 </style>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#a66b34" stroke-width="1.2"/></marker>
</defs>
<rect width="1200" height="820" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="head" font-size="28">حیاط مرکزی در خانهٔ سنتی ایران</text>
<text x="600" y="70" text-anchor="middle" class="small">خوانش گونه‌شناختی از خانه‌های حیاط‌دار یزد؛ بازسازی تلفیقی، غیرمقیاس‌دار، نه پلان یک بنای معین</text>
<rect x="30" y="95" width="555" height="625" rx="8" class="panel"/>
<rect x="605" y="95" width="565" height="300" rx="8" class="panel"/>
<rect x="605" y="410" width="565" height="310" rx="8" class="panel"/>
<text x="307" y="130" text-anchor="middle" class="head">۱. پلان سازمان فضایی</text>
<text x="887" y="130" text-anchor="middle" class="head">۲. مقطع رابطهٔ فضاها</text>
<text x="887" y="445" text-anchor="middle" class="head">۳. آکسونومتری باز</text>

<!-- PLAN: perimeter and room bands -->
<path class="wall" d="M86 180 H525 V655 H86 Z"/>
<!-- north room band -->
<rect x="190" y="180" width="232" height="105" class="inner"/>
<line x1="306" y1="180" x2="306" y2="285" class="fine"/>
<text x="306" y="224" text-anchor="middle" class="label">اتاق / تالار</text>
<text x="306" y="249" text-anchor="middle" class="small">فضای بسته</text>
<!-- east rooms -->
<rect x="422" y="285" width="103" height="132" class="inner"/>
<line x1="422" y1="350" x2="525" y2="350" class="fine"/>
<text x="474" y="336" text-anchor="middle" class="small">اتاق</text>
<text x="474" y="399" text-anchor="middle" class="small">اتاق</text>
<!-- west rooms -->
<rect x="86" y="285" width="104" height="132" class="inner"/>
<line x1="86" y1="350" x2="190" y2="350" class="fine"/>
<text x="138" y="336" text-anchor="middle" class="small">اتاق</text>
<text x="138" y="399" text-anchor="middle" class="small">اتاق</text>
<!-- south service/rooms -->
<rect x="190" y="545" width="232" height="110" class="inner"/>
<line x1="306" y1="545" x2="306" y2="655" class="fine"/>
<text x="306" y="594" text-anchor="middle" class="label">فضای بستهٔ جنوبی</text>
<text x="306" y="619" text-anchor="middle" class="small">کاربری متناسب با نمونه</text>
<!-- central courtyard -->
<rect x="190" y="285" width="232" height="260" fill="#f1ead8" stroke="#282824" stroke-width="4"/>
<rect x="270" y="372" width="72" height="86" rx="2" fill="#d7e6e7" stroke="#647f80" stroke-width="2"/>
<path d="M306 372 V458 M270 415 H342" stroke="#6f8d8e" stroke-width="1.5"/>
<circle cx="230" cy="325" r="10" fill="#82926d"/><circle cx="382" cy="325" r="10" fill="#82926d"/>
<circle cx="230" cy="505" r="10" fill="#82926d"/><circle cx="382" cy="505" r="10" fill="#82926d"/>
<text x="306" y="350" text-anchor="middle" class="label">حیاط باز به آسمان</text>
<text x="306" y="480" text-anchor="middle" class="small">حوض / باغچه در نمونه‌ها متغیر است</text>
<!-- semi-open edge/veranda north and west -->
<rect x="190" y="265" width="232" height="20" fill="#d5c6a7" stroke="#282824" stroke-width="2"/>
<line x1="220" y1="265" x2="220" y2="285" stroke="#282824" stroke-width="3"/>
<line x1="306" y1="265" x2="306" y2="285" stroke="#282824" stroke-width="3"/>
<line x1="390" y1="265" x2="390" y2="285" stroke="#282824" stroke-width="3"/>
<text x="306" y="257" text-anchor="middle" class="small">لبهٔ نیمه‌باز / رواق در برخی نمونه‌ها</text>
<!-- entrance / hashti / bent access -->
<rect x="422" y="417" width="103" height="128" fill="#e5ded0" stroke="#282824" stroke-width="3"/>
<path d="M447 435 L500 435 L500 488 L447 488 Z" fill="#fff" stroke="#5c564b" stroke-width="2"/>
<text x="473" y="466" text-anchor="middle" class="small">هشتی</text>
<path d="M525 480 H552 V610 H422" fill="none" stroke="#282824" stroke-width="7"/>
<path d="M550 610 H525" stroke="#fff" stroke-width="12"/>
<path d="M550 610 L550 580 L500 580 L500 545" fill="none" stroke="#a66b34" stroke-width="2.5" marker-end="url(#arr)"/>
<text x="478" y="634" text-anchor="middle" class="small">ورودی و دالان؛ مسیر در هر نمونه متفاوت</text>
<text x="105" y="690" class="small">پلان ترکیبی: فضاهای باز، نیمه‌باز و بسته تفکیک شده‌اند.</text>

<!-- SECTION -->
<line x1="650" y1="302" x2="1125" y2="302" stroke="#776d5d" stroke-width="4"/>
<rect x="665" y="188" width="135" height="114" fill="#eee9df" stroke="#282824" stroke-width="4"/>
<path d="M680 188 Q732 128 785 188" fill="none" stroke="#282824" stroke-width="4"/>
<rect x="810" y="210" width="100" height="92" fill="#eee9df" stroke="#282824" stroke-width="4"/>
<rect x="930" y="300" width="165" height="2" fill="#f1ead8"/>
<rect x="930" y="300" width="165" height="0" fill="none"/>
<!-- portico columns -->
<rect x="918" y="214" width="12" height="88" fill="#d7c8aa" stroke="#282824" stroke-width="2"/>
<rect x="1095" y="214" width="12" height="88" fill="#d7c8aa" stroke="#282824" stroke-width="2"/>
<path d="M918 214 Q1006 168 1107 214" fill="none" stroke="#282824" stroke-width="4"/>
<text x="730" y="236" text-anchor="middle" class="small">اتاق بسته</text>
<text x="858" y="250" text-anchor="middle" class="small">فضای واسط</text>
<text x="1012" y="253" text-anchor="middle" class="label">رواق / ایوان در نمونهٔ مربوط</text>
<text x="1012" y="284" text-anchor="middle" class="small">فضای نیمه‌باز</text>
<text x="1012" y="330" text-anchor="middle" class="small">حیاط بدون پوشش</text>
<text x="887" y="365" text-anchor="middle" class="small">رابطهٔ بسته ← نیمه‌باز ← باز؛ شکل دقیق مقطع وابسته به بنای مورد مطالعه است.</text>

