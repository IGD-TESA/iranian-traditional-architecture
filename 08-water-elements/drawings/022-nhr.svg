<title id="ttl">نهر — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی نهر در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
