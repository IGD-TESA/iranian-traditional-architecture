<path d="M90 180 H550 V265 H90 Z" fill="#c8e1ed" stroke="#252525" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M125 222 H500" fill="none" stroke="#285b78" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M480 207 L500 222 L480 237" fill="none" stroke="#285b78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
