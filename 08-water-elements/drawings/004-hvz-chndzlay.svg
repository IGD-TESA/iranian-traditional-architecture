<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800" role="img" aria-labelledby="t d">
<title id="t">حوض مرمرین هشت‌ضلعی؛ خانهٔ گلشن یزد، فضای ۲٫۹</title>
<desc id="d">بازنمایی تحلیلیِ حوض مرمرین هشت‌ضلعی که در تصویر داخلی Figure 16 مقالهٔ Zolfagharkhani و Foruzanmehr (2024) در خانهٔ گلشن یزد دیده می‌شود. دیاگرام فقط هشت‌ضلعی بودن و جنس مرمر گزارش‌شده را ثبت می‌کند؛ طول اضلاع، ابعاد کلی، عمق، پروفیل لبه، پایه و جزئیات ساخت از منبع قابل اندازه‌گیری نیست و بازسازی نشده است.</desc>
<defs>
 <style>
 .bg{fill:#f8f7f3}.panel{fill:#fff;stroke:#c9c4ba;stroke-width:2}.title{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:28px;font-weight:700;fill:#20282d}.subtitle{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:16px;fill:#4d5960}.head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:22px;font-weight:700;fill:#29363c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#5d686e}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#727b80}.stone{fill:#e2e0d9;stroke:#646b6d;stroke-width:5}.water{fill:#d8e8eb;stroke:#7b9ca4;stroke-width:2.5}.dash{stroke:#9b8f7e;stroke-width:1.5;stroke-dasharray:7 6;fill:none}.warning{fill:#f7f0e4;stroke:#d6c7ae;stroke-width:1.4}
 </style>
</defs>
<rect width="1120" height="800" class="bg"/>
<rect x="25" y="20" width="1070" height="90" rx="10" fill="#293940"/>
<text x="560" y="58" text-anchor="middle" class="title" style="fill:#fff" direction="rtl">حوض مرمرین هشت‌ضلعی — خانهٔ گلشن، یزد</text>
<text x="560" y="87" text-anchor="middle" class="subtitle" style="fill:#e2e8eb" direction="rtl">شاهد تصویری: فضای ۲٫۹، Figure 16 مقالهٔ ۲۰۲۴</text>

<rect x="30" y="140" width="650" height="555" rx="9" class="panel"/>
<text x="355" y="182" text-anchor="middle" class="head" direction="rtl">نمای بالا — تشخیص صورت چندضلعی</text>
<text x="355" y="210" text-anchor="middle" class="small" direction="rtl">هشت‌ضلعی بودن مستند است؛ هندسه و اندازه‌ها برداشت نشده‌اند.</text>
<!-- diagrammatic octagonal basin, non-dimensional -->
<polygon points="355,270 464,316 510,425 464,534 355,580 246,534 200,425 246,316" class="stone"/>
<polygon points="355,300 443,337 480,425 443,513 355,550 267,513 230,425 267,337" class="water"/>
<text x="355" y="418" text-anchor="middle" class="body" direction="rtl">حوض مرمرین</text>
<text x="355" y="448" text-anchor="middle" class="small" direction="rtl">هشت‌ضلعی</text>
<path d="M510 425H595V365" class="dash"/>
<text x="605" y="348" text-anchor="end" class="small" direction="rtl">لبهٔ پیرامونی</text>
<text x="355" y="625" text-anchor="middle" class="tiny" direction="rtl">دو خط پیرامونی فقط برای توضیح لبه و محدودهٔ داخلی ترسیم شده‌اند؛</text>
<text x="355" y="648" text-anchor="middle" class="tiny" direction="rtl">ضخامت لبه، عرض دهانه و نسبت‌ها از شکل شماتیک قابل اندازه‌گیری نیستند.</text>

<rect x="705" y="140" width="385" height="555" rx="9" class="panel"/>
<text x="897" y="182" text-anchor="middle" class="head" direction="rtl">اطلاعات مستند و نامعلوم</text>
<rect x="735" y="225" width="325" height="120" rx="7" fill="#edf1f0" stroke="#bac7c3"/>
<text x="897" y="260" text-anchor="middle" class="body" direction="rtl">مستند از تصویر مقاله</text>
<text x="897" y="295" text-anchor="middle" class="small" direction="rtl">• جنس: مرمر</text>
<text x="897" y="324" text-anchor="middle" class="small" direction="rtl">• صورت کلی: هشت‌ضلعی</text>
<rect x="735" y="365" width="325" height="230" rx="7" class="warning"/>
<text x="897" y="402" text-anchor="middle" class="body" direction="rtl">در منبع اندازه‌گذاری نشده</text>
<text x="897" y="443" text-anchor="middle" class="small" direction="rtl">• طول اضلاع و قطر کلی</text>
<text x="897" y="478" text-anchor="middle" class="small" direction="rtl">• عمق، ارتفاع و پروفیل لبه</text>
<text x="897" y="513" text-anchor="middle" class="small" direction="rtl">• پایه، اتصالات و جزئیات ساخت</text>
<text x="897" y="557" text-anchor="middle" class="small" direction="rtl">• نسبت دقیق با کف و عناصر پیرامون</text>
<text x="897" y="655" text-anchor="middle" class="tiny" direction="rtl">این شیت، بازترسیم اجرایی یا برداشت میدانی نیست.</text>

<rect x="30" y="720" width="1060" height="46" rx="6" fill="#eeeae1" stroke="#c9c1b3"/>
<text x="560" y="749" text-anchor="middle" class="tiny" direction="rtl">Zolfagharkhani &amp; Foruzanmehr (2024), Buildings 14(9), 2639, Figure 16, DOI: 10.3390/buildings14092639 · CC BY 4.0</text>
</svg>