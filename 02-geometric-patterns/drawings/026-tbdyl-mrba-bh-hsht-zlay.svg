<title id="ttl">تبدیل مربع به هشت‌ضلعی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی تبدیل مربع به هشت‌ضلعی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
