<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db" stroke-width="1"/>
<rect x="95" y="125" width="190" height="190" fill="#e7edf1" stroke="#252525" stroke-width="3"/><rect x="285" y="175" width="255" height="140" fill="#d9e7ee" stroke="#252525" stroke-width="3"/><line x1="285" y1="95" x2="285" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="190" y="225" text-anchor="middle" font-size="15" direction="rtl">مربع</text><text x="412" y="250" text-anchor="middle" font-size="15" direction="rtl">مستطیل</text>
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db" stroke-width="1"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
