<title id="title">ترکیب مربع و مستطیل — ترسیم شماتیک بازبینی‌شده</title><desc id="desc">ترکیب دو واحد هندسی با نسبت‌های متفاوت؛ محل اتصال و هم‌محوری در نمونهٔ واقعی باید از پلان برداشت‌شده استخراج شود.</desc>
