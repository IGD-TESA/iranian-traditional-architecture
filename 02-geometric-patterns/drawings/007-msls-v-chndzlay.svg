<title id="title">مثلث و چندضلعی — ترسیم شماتیک بازبینی‌شده</title><desc id="desc">دو صورت هندسی مستقل برای مقایسه؛ چندضلعی سمت راست، نمونه‌ای شماتیک و نه شکل منتظم مشخص است.</desc>
