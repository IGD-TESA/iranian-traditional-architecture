<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">مثلث و چندضلعی</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db" stroke-width="1"/>
<polygon points="175,105 290,325 60,325" fill="#e7edf1" stroke="#252525" stroke-width="3"/><polygon points="445,95 555,170 520,305 390,335 315,220 350,115" fill="#e7edf1" stroke="#252525" stroke-width="3"/><text x="175" y="365" text-anchor="middle" font-size="14" direction="rtl">مثلث</text><text x="440" y="365" text-anchor="middle" font-size="14" direction="rtl">چندضلعی</text>
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db" stroke-width="1"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
