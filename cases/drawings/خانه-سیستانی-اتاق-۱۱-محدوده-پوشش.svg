<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="t d">
<title id="t">اتاق ۱۱ خانهٔ سیستانی، ارگ بم — محدودهٔ پوشش</title>
<desc id="d">محدودهٔ پوشش با امتداد طولی حدود ۵٫۳۰ متر و دهانهٔ قوس ۳٫۵۷ متر. مکان قوس‌های میانی در این ترسیم تعیین نشده است.</desc>
<defs><style>
.h{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:25px;font-weight:700;fill:#292722}
.s{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:16px;fill:#5c574e}
.d{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:18px;fill:#775a39}
.w{fill:#f0eadf;stroke:#292722;stroke-width:4}
.dim{stroke:#8d7251;stroke-width:2;fill:none}
</style></defs>
<rect width="920" height="620" fill="#fff"/>
<text x="460" y="43" text-anchor="middle" class="h">خانهٔ سیستانی، ارگ بم — اتاق ۱۱</text>
<text x="460" y="76" text-anchor="middle" class="s">محدودهٔ ابعادی پوشش طاق‌های آهنگ مایل؛ بدون جانمایی فرضی قوس‌ها</text>
<rect x="180" y="155" width="530" height="357" class="w"/>
<line x1="180" y1="128" x2="710" y2="128" class="dim"/>
<line x1="180" y1="117" x2="180" y2="139" class="dim"/>
<line x1="710" y1="117" x2="710" y2="139" class="dim"/>
<text x="445" y="117" text-anchor="middle" class="d">حدود ۵٫۳۰ متر — امتداد طولی پوشش</text>
<line x1="746" y1="155" x2="746" y2="512" class="dim"/>
<line x1="735" y1="155" x2="758" y2="155" class="dim"/>
<line x1="735" y1="512" x2="758" y2="512" class="dim"/>
<text x="778" y="333" transform="rotate(90 778 333)" text-anchor="middle" class="d">۳٫۵۷ متر — دهانهٔ قوس</text>
<text x="445" y="320" text-anchor="middle" class="s">محدودهٔ ابعادی پوشش</text>
<text x="460" y="548" text-anchor="middle" class="s">گزارش چهار قوس عرضی و قوس‌های طولیِ تکیه‌گاهی را ذکر می‌کند.</text>
<text x="460" y="575" text-anchor="middle" class="s">فاصلهٔ دقیق قوس‌های میانی در این تصویر تعیین نشده؛ این مستطیل نقشهٔ کامل اتاق نیست.</text>
<text x="460" y="600" text-anchor="middle" class="s">Wendland (2007), Room 11, pp. 48–51, DOI: 10.18419/OPUS-47</text>
<a href="https://d-nb.info/1081642564/34#page=7"><text x="460" y="616" text-anchor="middle" class="s">مشاهدهٔ مدل CAD و مقطع سطح زیرین پوشش</text></a>
</svg>