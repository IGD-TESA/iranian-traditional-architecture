<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" role="img" aria-labelledby="t d">
<title id="t">خانهٔ طاق‌بلندها، یزد — فضای ۲٫۸، پلان و مقطع و فرورفتگی‌های دیواری</title>
<desc id="d">بازترسیم تحلیلی از Figure 2 و شرح مقالهٔ 2024. پلان 4.15 در 4.35 متر، ارتفاع 5.93 متر، نورگیر سقفی و دو الگوی فرورفتگی دیواری. ابعاد فرورفتگی‌ها و پروفیل دقیق طاق مشخص نیستند.</desc>
<defs><style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#cfc8ba;stroke-width:2}.h1{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:31px;font-weight:700;fill:#252b2e}.h2{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:21px;font-weight:700;fill:#30383c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#60686a}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#697174}.wall{fill:#e7e0d3;stroke:#343a3c;stroke-width:5}.room{fill:#fff;stroke:#4b5355;stroke-width:2.5}.recess{fill:#f5f1e8;stroke:#755e49;stroke-width:2}.dim{stroke:#795f3f;stroke-width:2;fill:none}.dash{stroke:#9a8062;stroke-width:2.2;stroke-dasharray:8 6;fill:none}.note{fill:#f1eee7;stroke:#c9c0b2;stroke-width:1.5}
</style></defs>
<rect width="1500" height="1060" class="bg"/>
<text x="750" y="52" text-anchor="middle" class="h1">خانهٔ طاق‌بلندها، یزد — فضای ۲٫۸</text>
<text x="750" y="83" text-anchor="middle" class="body">پلان و مقطع تحلیلی از Figure 2؛ تمرکز بر ارتفاع و الگوهای فرورفتگی دیوار</text>

<rect x="45" y="120" width="660" height="700" rx="10" class="panel"/>
<text x="80" y="165" class="h2">۱. پلان فضای ۲٫۸</text>
<text x="80" y="192" class="small">ابعاد گزارش‌شده: ۴٫۱۵ × ۴٫۳۵ متر؛ مساحت ۱۸٫۰۵ مترمربع</text>
<rect x="195" y="300" width="332" height="348" class="wall"/>
<rect x="211" y="316" width="300" height="316" class="room"/>
<rect x="310" y="415" width="102" height="102" fill="#f6f3ec" stroke="#988a73" stroke-width="2" stroke-dasharray="5 5"/>
<text x="361" y="458" text-anchor="middle" class="small">گشودگی سقف</text>
<text x="361" y="480" text-anchor="middle" class="tiny">نور و تهویه</text>
<text x="361" y="565" text-anchor="middle" class="body">فضای ۲٫۸</text>
<line x1="195" y1="265" x2="527" y2="265" class="dim"/>
<line x1="195" y1="253" x2="195" y2="277" class="dim"/>
<line x1="527" y1="253" x2="527" y2="277" class="dim"/>
<text x="361" y="253" text-anchor="middle" class="body">۴٫۱۵ متر</text>
<line x1="560" y1="300" x2="560" y2="648" class="dim"/>
<line x1="548" y1="300" x2="572" y2="300" class="dim"/>
<line x1="548" y1="648" x2="572" y2="648" class="dim"/>
<text x="586" y="474" transform="rotate(90 586 474)" text-anchor="middle" class="body">۴٫۳۵ متر</text>
<text x="80" y="708" class="small">دسترسی از دالان و ایوان به حیاط مرکزی گزارش شده است.</text>
<text x="80" y="738" class="tiny">مکان دقیق درگاه‌ها و ابعاد آن‌ها در این شیت بازسازی نشده‌اند.</text>
<text x="80" y="768" class="tiny">گشودگی سقفی در پلان فقط با نشانهٔ موقعیت کلی نمایش داده شده؛ محل دقیق از متن قابل استخراج نیست.</text>

<rect x="735" y="120" width="720" height="700" rx="10" class="panel"/>
<text x="770" y="165" class="h2">۲. مقطع اتاق</text>
<text x="770" y="192" class="small">ارتفاع داخلی: ۵٫۹۳ متر؛ پروفیل قوس/طاق در این بازترسیم شماتیک است.</text>
<rect x="850" y="500" width="430" height="250" fill="#f7f4ed" stroke="#343a3c" stroke-width="5"/>
<path d="M850 500 Q1065 210 1280 500" class="dash"/>
<rect x="1035" y="265" width="60" height="22" fill="#fff" stroke="#8d7960" stroke-width="2" stroke-dasharray="5 4"/>
<text x="1110" y="274" class="small">گشودگی سقفی</text>
<text x="1065" y="635" text-anchor="middle" class="body">اتاق ۲٫۸</text>
<line x1="1315" y1="500" x2="1315" y2="750" class="dim"/>
<line x1="1303" y1="500" x2="1327" y2="500" class="dim"/>
<line x1="1303" y1="750" x2="1327" y2="750" class="dim"/>
<text x="1342" y="630" transform="rotate(90 1342 630)" text-anchor="middle" class="body">۵٫۹۳ متر</text>
<text x="770" y="790" class="tiny">منبع، نوع پوشش را «قوس/طاق» گزارش می‌کند؛ شعاع، خیز و جزئیات هندسیِ پوشش از متن قابل استخراج نیست.</text>

<rect x="45" y="845" width="690" height="150" rx="10" class="panel"/>
<text x="80" y="885" class="h2">۳. الگوی فرورفتگی در محور اول</text>
<text x="80" y="910" class="small">فرورفتگی قوسیِ تمام‌قد روبه‌روی در؛ دو فرورفتگی کوچک در دو طرف</text>
<path d="M125 975 V930 Q260 820 395 930 V975" class="recess"/>
<rect x="105" y="943" width="44" height="32" class="recess"/>
<rect x="371" y="943" width="44" height="32" class="recess"/>
<text x="470" y="950" class="tiny">مقیاس و اندازه‌ها</text>
<text x="470" y="970" class="tiny">در مقاله مشخص نیست.</text>

<rect x="765" y="845" width="690" height="150" rx="10" class="panel"/>
<text x="800" y="885" class="h2">۴. الگوی فرورفتگی در محور دوم</text>
<text x="800" y="910" class="small">سه فرورفتگی مستطیلی؛ دو طرف بزرگ‌تر از میانی</text>
<rect x="825" y="930" width="105" height="55" class="recess"/>
<rect x="950" y="950" width="78" height="35" class="recess"/>
<rect x="1048" y="930" width="105" height="55" class="recess"/>
<text x="1190" y="950" class="tiny">این دو الگو از متن و</text>
<text x="1190" y="970" class="tiny">شرح شکل‌ها استخراج شده‌اند؛</text>
<text x="1190" y="990" class="tiny">همهٔ ۱۲ فرورفتگی ترسیم نشده‌اند.</text>

<text x="750" y="1035" text-anchor="middle" class="tiny">Zolfagharkhani &amp; Foruzanmehr (2024), Figure 2 and section 4.1, CC BY 4.0 — DOI: 10.3390/buildings14092639</text>
</svg>