<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="t d">
<title id="t">برج آرامگاهی شرقی خرقان — بازترسیم تحلیلی پلان شکل ۸</title>
<desc id="d">بازترسیم تحلیلی پلان هشت‌ضلعی برج شرقی خرقان از شکل ۸ مقالهٔ Hassani و Rafiee سال ۲۰۱۳، با هشت پایه و دو پلکان در دو پایهٔ مدور. نقشه بی‌مقیاس است و ابعاد غیرقابل خواندن به آن افزوده نشده‌اند.</desc>
<defs>
<style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#cbc5b9;stroke-width:2}.head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:30px;font-weight:700;fill:#242a2d}.sub{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#5c6366}.lab{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:19px;fill:#343c40}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:15px;fill:#5f686b}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:13px;fill:#6b7274}.wall{fill:#e7e0d3;stroke:#343a3c;stroke-width:5}.pillar{fill:#c6ad92;stroke:#614d3c;stroke-width:3}.round{fill:#d5c1a7;stroke:#614d3c;stroke-width:3}.stair{fill:none;stroke:#6b5947;stroke-width:2.4}.axis{stroke:#aaa398;stroke-width:1.2;stroke-dasharray:7 7}.note{fill:#f1eee7;stroke:#c9c0b2;stroke-width:1.5}
</style>
</defs>
<rect width="1200" height="1050" class="bg"/>
<text x="600" y="52" text-anchor="middle" class="head">برج آرامگاهی شرقی خرقان، قزوین</text>
<text x="600" y="83" text-anchor="middle" class="sub">پلان هشت‌ضلعی — بازترسیم تحلیلی از Figure 8 در مقالهٔ فتوگرامتری سال ۲۰۱۳</text>
<rect x="90" y="115" width="1020" height="820" rx="12" class="panel"/>
<text x="130" y="160" class="lab">پلان اصلی</text>
<text x="1070" y="160" text-anchor="end" class="small">بی‌مقیاس — بدون افزودن ابعاد حدسی</text>
<!-- axis guides -->
<line x1="600" y1="205" x2="600" y2="855" class="axis"/>
<line x1="275" y1="530" x2="925" y2="530" class="axis"/>
<!-- Outer octagonal boundary -->
<polygon points="600,230 805,315 890,530 805,745 600,830 395,745 310,530 395,315" class="wall"/>
<!-- interior ring -->
<polygon points="600,285 768,355 835,530 768,705 600,775 432,705 365,530 432,355" fill="#f8f5ef" stroke="#4d5557" stroke-width="3.5"/>
<!-- central open space -->
<polygon points="600,350 720,400 770,530 720,660 600,710 480,660 430,530 480,400" fill="#fff" stroke="#545b5d" stroke-width="3"/>
<text x="600" y="516" text-anchor="middle" class="lab">فضای مرکزی</text>
<text x="600" y="543" text-anchor="middle" class="small">هندسهٔ هشت‌ضلعی</text>
<!-- radial walls / supports -->
<path d="M600 285 L600 350 M768 355 L720 400 M835 530 L770 530 M768 705 L720 660 M600 775 L600 710 M432 705 L480 660 M365 530 L430 530 M432 355 L480 400" stroke="#5c5b53" stroke-width="20" fill="none"/>
<!-- pillars: 6 rectangular blocks around ring -->
<rect x="575" y="272" width="50" height="68" rx="3" class="pillar"/>
<rect x="748" y="347" width="68" height="48" rx="3" transform="rotate(22 782 371)" class="pillar"/>

<rect x="748" y="665" width="68" height="48" rx="3" transform="rotate(-22 782 689)" class="pillar"/>
<rect x="575" y="740" width="50" height="68" rx="3" class="pillar"/>
<rect x="384" y="665" width="68" height="48" rx="3" transform="rotate(22 418 689)" class="pillar"/>
<!-- two round pillars with spiral stairs -->
<circle cx="390" cy="530" r="48" class="round"/>
<circle cx="810" cy="530" r="48" class="round"/>
<path d="M390 530
c-30 -32 -56 7 -31 33
c29 28 67 -10 41 -38
c-22 -22 -52 4 -34 24
c17 17 38 -6 22 -18" class="stair"/>
<path d="M810 530
c-30 -32 -56 7 -31 33
c29 28 67 -10 41 -38
c-22 -22 -52 4 -34 24
c17 17 38 -6 22 -18" class="stair"/>
<!-- remaining two supports as square piers on upper left/right -->
<rect x="384" y="347" width="68" height="48" rx="3" transform="rotate(-22 418 371)" class="pillar"/>

<!-- labels -->
<path d="M600 235 L600 194 L790 194" fill="none" stroke="#8a7358" stroke-width="1.5"/>
<text x="800" y="200" class="small">پایهٔ پیرامونی</text>
<path d="M810 530 L930 530 L930 480" fill="none" stroke="#8a7358" stroke-width="1.5"/>
<text x="940" y="470" class="small">پایهٔ مدور</text>
<text x="940" y="492" class="small">با پلکان داخلی</text>
<path d="M600 710 L600 870 L805 870" fill="none" stroke="#8a7358" stroke-width="1.5"/>
<text x="815" y="876" class="small">فضای مرکزیِ پوشیده</text>
<path d="M390 530 L250 530 L250 475" fill="none" stroke="#8a7358" stroke-width="1.5"/>
<text x="145" y="463" class="small">پلکان دوم</text>
<text x="145" y="485" class="small">در پایهٔ مدور</text>
<!-- compass -->
<path d="M1010 270 L1010 215 M1001 228 L1010 215 L1019 228" fill="none" stroke="#3f474a" stroke-width="2"/>
<text x="1010" y="198" text-anchor="middle" class="small">شمال</text>

<rect x="125" y="955" width="950" height="65" rx="7" class="note"/>
<text x="150" y="982" class="small">مبنای داده: پلان هشت‌ضلعی، هشت پایه و دو پلکان در دو پایهٔ مدور؛ موقعیت دقیق اجزا در شکل ۸ منبع باید با نقشهٔ اصلی کنترل شود.</text>
<text x="150" y="1005" class="tiny">این SVG بازترسیم هندسیِ تحلیلی از Figure 8 است، نه برداشت میدانی جدید و نه نقشهٔ اندازه‌دار. جزئیات پیرامونی ساده‌سازی شده‌اند.</text>
<text x="600" y="1040" text-anchor="middle" class="tiny">Hassani &amp; Rafiee (2013), Figure 8 — DOI: 10.5194/isprsarchives-XL-5-W2-313-2013</text>
</svg>