<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">بادگیر خانهٔ لاری‌ها در یزد — شیت پلان، نما، مقطع و عملکرد</title>
<desc id="desc">بازترسیم تحلیلی مبتنی بر شکل‌های ۶ تا ۱۰ مقالهٔ Armanfar و Akdeniz در سال ۲۰۲۴. پلان خارجی با اندازه‌های ۶٫۱۹ در ۳٫۵۹ متر، شش کانال بدون حدس دربارهٔ آرایش آن‌ها، نما و دو مقطع با ترازهای گزارش‌شده.</desc>
<defs>
<style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#cfc8ba;stroke-width:2}.h1{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:33px;font-weight:700;fill:#20272b}.h2{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:23px;font-weight:700;fill:#30383c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:18px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:15px;fill:#596166}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:13px;fill:#656d70}.dim{stroke:#795f3f;stroke-width:2;fill:none}.wall{stroke:#343a3c;stroke-width:5;fill:#eee9dd}.inner{stroke:#5c5b53;stroke-width:2.5;fill:none}.thin{stroke:#7a7f7e;stroke-width:1.5;fill:none}.dash{stroke:#a57c4b;stroke-width:2;stroke-dasharray:7 6;fill:none}.air{stroke:#247b9a;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.hot{stroke:#b86b3b;stroke-width:3.5;fill:none;stroke-linecap:round}.brick{fill:#c9a78d;stroke:#694d3a;stroke-width:1.5}.plaster{fill:#e4dfd2;stroke:#77746b;stroke-width:1.5}.datum{stroke:#9a8b73;stroke-width:1.4;stroke-dasharray:4 5}
</style>
<marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#247b9a"/></marker>
<marker id="hotArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b86b3b"/></marker>
</defs>
<rect width="1600" height="1160" class="bg"/>
<text x="800" y="55" text-anchor="middle" class="h1">خانهٔ لاری‌ها، یزد — بادگیر چهارجهتهٔ بخش تابستانی</text>
<text x="800" y="88" text-anchor="middle" class="body">پروندهٔ موردی؛ بازترسیم تحلیلی از نقشه‌ها و داده‌های برداشت میدانیِ منتشرشده</text>
<text x="800" y="116" text-anchor="middle" class="small">منبع پایه: Armanfar &amp; Akdeniz, 2024 — Figures 6–10 — ابعاد و ترازها فقط در حدود داده‌های منبع</text>

<rect x="45" y="145" width="720" height="390" rx="9" class="panel"/>
<text x="75" y="185" class="h2">۱. پلان خارجی بادگیر</text>
<text x="75" y="211" class="small">مستطیل بیرونی برداشت‌شده؛ تقسیمات داخلی مربع و شش کانال در متن گزارش شده‌اند.</text>
<rect x="190" y="270" width="420" height="244" class="wall"/>
<rect x="211" y="291" width="378" height="202" class="inner"/>
<text x="400" y="372" text-anchor="middle" class="body">پلان خارجی بادگیر</text>
<text x="400" y="399" text-anchor="middle" class="small">تقسیمات داخلی: مربع‌گون</text>
<text x="400" y="426" text-anchor="middle" class="small">۶ کانال تهویه — تعداد گزارش‌شده</text>
<line x1="190" y1="248" x2="610" y2="248" class="dim"/>
<line x1="190" y1="237" x2="190" y2="260" class="dim"/>
<line x1="610" y1="237" x2="610" y2="260" class="dim"/>
<text x="400" y="239" text-anchor="middle" class="body">۶٫۱۹ متر</text>
<line x1="637" y1="270" x2="637" y2="514" class="dim"/>
<line x1="626" y1="270" x2="648" y2="270" class="dim"/>
<line x1="626" y1="514" x2="648" y2="514" class="dim"/>
<text x="665" y="392" transform="rotate(90 665 392)" text-anchor="middle" class="body">۳٫۵۹ متر</text>
<text x="75" y="488" class="small">مکان و اندازهٔ تک‌تک کانال‌ها در این شیت بازسازی نشده است.</text>

<rect x="790" y="145" width="765" height="390" rx="9" class="panel"/>
<text x="820" y="185" class="h2">۲. نما و ترازهای ارتفاعی</text>
<text x="820" y="211" class="small">تقسیم‌بندی سه‌گانهٔ بدنه: بخش ورودی هوا، نوارهای آجری و بدنهٔ ساده</text>
