<path d="M335 950 V895 Q380 845 425 895 V950" fill="none" stroke="#343a3c" stroke-width="3"/>
<path d="M356 940 V915 Q380 885 404 915 V940" fill="none" stroke="#343a3c" stroke-width="2"/>
