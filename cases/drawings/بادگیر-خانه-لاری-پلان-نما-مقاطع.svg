<rect x="1082" y="346" width="216" height="17" fill="#a97852" stroke="#694d3a" stroke-width="1.5"/>
<rect x="1082" y="363" width="216" height="18" class="plaster"/>
<path d="M1082 381 L1298 381 L1298 496 L1082 496Z" fill="#e5d7c6" stroke="#343a3c" stroke-width="4"/>
<rect x="1082" y="381" width="216" height="17" fill="#b88a65" stroke="#694d3a" stroke-width="1.5"/>
<rect x="1082" y="398" width="216" height="98" fill="#e5d7c6" stroke="#343a3c" stroke-width="1.5"/>
<line x1="1050" y1="496" x2="1330" y2="496" stroke="#343a3c" stroke-width="4"/>
<line x1="1045" y1="381" x2="1335" y2="381" class="datum"/>
<line x1="1045" y1="363" x2="1335" y2="363" class="datum"/>
<line x1="1045" y1="346" x2="1335" y2="346" class="datum"/>
<line x1="1045" y1="256" x2="1335" y2="256" class="datum"/>
<line x1="1045" y1="496" x2="1335" y2="496" class="datum"/>
<text x="1350" y="262" class="small">ورودی هوا / شبکهٔ عمودی</text>
<text x="1350" y="352" class="small">نوار آجری</text>
<text x="1350" y="378" class="small">نوار تزئینی بدنه</text>
<text x="1350" y="414" class="small">بدنهٔ ساده</text>
<text x="1350" y="502" class="small">تراز بام / پایهٔ برج</text>
<line x1="1012" y1="240" x2="1012" y2="496" class="dim"/>
<line x1="1002" y1="240" x2="1022" y2="240" class="dim"/>
<line x1="1002" y1="496" x2="1022" y2="496" class="dim"/>
<text x="986" y="368" transform="rotate(-90 986 368)" text-anchor="middle" class="body">۱۹٫۷۴ متر از کف اتاق</text>
<text x="820" y="524" class="small">عرض نما ترسیمی و غیرمقیاس است؛ منبع برای این نما در متن، اندازهٔ عرضی قطعی ارائه نمی‌کند.</text>

<rect x="45" y="560" width="720" height="455" rx="9" class="panel"/>
<text x="75" y="602" class="h2">۳. مقطع C–C — کانال چندخروجی</text>
<text x="75" y="628" class="small">بازترسیم بر اساس Figure 8؛ ترازها عین مقادیر چاپ‌شده‌اند، عرض مقطع غیرمقیاس است.</text>
<line x1="140" y1="965" x2="650" y2="965" stroke="#343a3c" stroke-width="4"/>
