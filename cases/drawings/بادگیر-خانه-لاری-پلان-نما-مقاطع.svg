<line x1="265" y1="840" x2="480" y2="840" class="datum"/>
<line x1="265" y1="965" x2="480" y2="965" class="datum"/>
<text x="500" y="706" class="small">+8.83 / +8.48 — ترازهای نزدیک بام</text>
<text x="500" y="846" class="small">+2.84</text>
<text x="500" y="971" class="small">+0.00</text>
<text x="380" y="775" text-anchor="middle" class="small">مسیر نزول هوا</text>
<path d="M380 740 L380 875" class="air" marker-end="url(#blueArrow)"/>
<path d="M380 910 C420 900 450 880 500 875" class="air" marker-end="url(#blueArrow)"/>
<text x="75" y="1000" class="tiny">نمایش شماتیک خروجی‌های قوسی؛ شکل و تعداد دقیق دهانه‌ها باید با تصویر اصلی Figure 8 کنترل شود.</text>

<rect x="790" y="560" width="765" height="455" rx="9" class="panel"/>
<text x="820" y="602" class="h2">۴. مقطع D–D و رابطه با ایوان تابستانی</text>
<text x="820" y="628" class="small">منبع: Figure 6 و Figure 8؛ مسیر عملکردی مطابق شرح نویسندگان</text>
<rect x="920" y="690" width="150" height="274" class="plaster"/>
<rect x="942" y="705" width="106" height="245" fill="#fff" stroke="#77746b" stroke-width="2"/>
<rect x="920" y="660" width="150" height="30" class="brick"/>
