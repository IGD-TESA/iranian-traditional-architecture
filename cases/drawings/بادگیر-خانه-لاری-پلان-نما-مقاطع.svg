<path d="M945 945 V900 Q995 845 1045 900 V945" fill="none" stroke="#343a3c" stroke-width="3"/>
<text x="995" y="790" text-anchor="middle" class="small">بادگیر</text>
<path d="M995 690 V875" class="air" marker-end="url(#blueArrow)"/>
<path d="M1190 950 L1190 820 Q1270 695 1350 820 L1350 950" fill="#eee9dd" stroke="#343a3c" stroke-width="4"/>
<line x1="1140" y1="950" x2="1450" y2="950" stroke="#343a3c" stroke-width="4"/>
<text x="1270" y="890" text-anchor="middle" class="h2">ایوان باز</text>
<text x="1270" y="918" text-anchor="middle" class="small">ارتباط با گذرگاه کوچک</text>
<path d="M1070 880 C1110 880 1145 880 1190 880" class="air" marker-end="url(#blueArrow)"/>
<path d="M1280 810 C1280 770 1280 730 1280 690" class="hot" marker-end="url(#hotArrow)"/>
<text x="1360" y="710" class="small">هوای گرم</text>
<text x="1360" y="732" class="small">به سمت حیاط</text>
<text x="995" y="660" text-anchor="middle" class="small">ورودی هوا از بالا</text>
<text x="995" y="990" text-anchor="middle" class="tiny">بخش زیرین بادگیر و گذرگاه</text>

<rect x="45" y="1035" width="1510" height="92" rx="8" fill="#f0eee7" stroke="#cfc8ba" stroke-width="1.5"/>
<text x="75" y="1070" class="body">داده‌های صریح منبع: پلان خارجی ۶٫۱۹ × ۳٫۵۹ متر؛ ۶ کانال؛ ارتفاع ۱۰٫۸۶ متر از بام و ۱۹٫۷۴ متر از کف اتاق؛ بادگیر چهارجهته.</text>
<text x="75" y="1099" class="small">محدودیت: مکان دقیق کانال‌ها و برخی جزئیات مقطع در این شیت بازسازی نشده و باید با نقشهٔ چاپی Figure 7–8 کنترل نهایی شود. این شیت نقشهٔ اجرایی یا برداشت جدید نیست.</text>
<text x="1520" y="1145" text-anchor="end" class="tiny">Armanfar &amp; Akdeniz (2024), Figures 6–10, DOI: 10.26835/my.1264810</text>
