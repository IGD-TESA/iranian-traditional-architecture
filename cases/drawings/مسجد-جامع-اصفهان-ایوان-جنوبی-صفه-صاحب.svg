<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="t d">
<title id="t">مسجد جامع اصفهان — ایوان جنوبی، صفهٔ صاحب</title>
<desc id="d">پروندهٔ موردیِ ایوان جنوبی، صفهٔ صاحب مسجد جامع اصفهان. اندازهٔ پلان حدود ۱۲ × ۱۲ متر گزارش شده؛ عنوان پوشش «Taq-e Dozd» است و مقطع دقیق از متن به‌طور مطمئن قابل استخراج نیست.</desc>
<defs><style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#cfc8ba;stroke-width:2}.h1{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:30px;font-weight:700;fill:#252b2e}.h2{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:21px;font-weight:700;fill:#30383c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#60686a}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#697174}.dim{stroke:#795f3f;stroke-width:2;fill:none}.note{fill:#f1eee7;stroke:#c9c0b2;stroke-width:1.5}
</style></defs>
<rect width="1500" height="950" class="bg"/>
<text x="750" y="52" text-anchor="middle" class="h1">مسجد جامع اصفهان — ایوان جنوبی، صفهٔ صاحب</text>
<text x="750" y="85" text-anchor="middle" class="body">شیت پلان و اطلاعات پوشش — پروندهٔ ثبت جهانی یونسکو، ۲۰۱۱</text>
<rect x="45" y="150" width="680" height="610" rx="10" class="panel"/>
<text x="80" y="195" class="h2">۱. پلان ایوان</text>
<text x="80" y="222" class="small">پلان مربع با ضلع حدود ۱۲ متر؛ بازشو رو به صحن به سمت شمال، رو به صحن</text>
<rect x="280" y="285" width="300" height="300" fill="#f5f1e8" stroke="#323a3e" stroke-width="5"/>
 <path d="M280 285 V585 M580 285 V585 M280 285 H580" fill="none" stroke="#323a3e" stroke-width="5"/>
 <line x1="280" y1="585" x2="580" y2="585" stroke="#9a7550" stroke-width="4" stroke-dasharray="9 7"/>
 <text x="430" y="427" text-anchor="middle" class="body">فضای ایوان</text>
 <text x="430" y="455" text-anchor="middle" class="small">پلان مربع</text>
 <text x="430" y="620" text-anchor="middle" class="small">گشودگی رو به صحن</text>
 <line x1="280" y1="255" x2="580" y2="255" class="dim"/>
 <line x1="280" y1="243" x2="280" y2="267" class="dim"/>
 <line x1="580" y1="243" x2="580" y2="267" class="dim"/>
 <text x="430" y="245" text-anchor="middle" class="body">حدود ۱۲ متر</text>
 <line x1="610" y1="285" x2="610" y2="585" class="dim"/>
 <line x1="598" y1="285" x2="622" y2="285" class="dim"/>
 <line x1="598" y1="585" x2="622" y2="585" class="dim"/>
 <text x="635" y="435" transform="rotate(90 635 435)" text-anchor="middle" class="body">حدود ۱۲ متر</text>
<text x="80" y="715" class="small">سه جبهه محصور و یک جبهه باز به سوی صحن در این پلان تحلیلی نشان داده شده است.</text>
<rect x="770" y="160" width="680" height="600" rx="10" class="panel"/>
 <text x="805" y="205" class="h2">۲. محدودیت سند پوشش</text>
 <text x="805" y="250" class="body">پرونده، پوشش را با عنوان «Taq-e Dozd» معرفی می‌کند.</text>
 <text x="805" y="285" class="small">توضیح منبع نشان می‌دهد احتمالاً در مرحله‌ای پوشش تخت با تیرهای چوبی</text>
 <text x="805" y="310" class="small">بر ردیفی از قوس‌ها وجود داشته است؛ شکل دقیق سازه از متن قابل بازسازی نیست.</text>
 <rect x="850" y="375" width="500" height="220" fill="#f7f4ed" stroke="#b1a99b" stroke-width="2" stroke-dasharray="8 6"/>
 <text x="1100" y="475" text-anchor="middle" class="h2">مقطع اندازه‌دار</text>
 <text x="1100" y="510" text-anchor="middle" class="small">در این پرونده ترسیم نشده است</text>
 <text x="805" y="705" class="tiny">به‌منظور جلوگیری از جعل فرم تاریخی، فقط پلان و اندازهٔ ثبت‌شده نمایش داده می‌شود.</text>
<rect x="45" y="790" width="1405" height="100" rx="8" class="note"/>
<text x="80" y="830" class="body">اندازهٔ پلان حدود ۱۲ × ۱۲ متر گزارش شده؛ عنوان پوشش «Taq-e Dozd» است و مقطع دقیق از متن به‌طور مطمئن قابل استخراج نیست.</text>
<text x="80" y="862" class="small">ابعاد پلان از پروندهٔ ثبت جهانی نقل شده‌اند؛ ضخامت دیوار، ارتفاع و جزئیات قوس در این SVG اندازه‌گذاری نشده‌اند.</text>
<text x="750" y="925" text-anchor="middle" class="tiny">Iranian Cultural Heritage Organization (2011), Masjed-e Jāme’ of Isfahan, UNESCO Nomination File 1397.</text>
</svg>