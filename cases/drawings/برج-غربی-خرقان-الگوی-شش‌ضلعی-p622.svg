<title id="t">برج غربی خرقان — شبکهٔ شش‌ضلعی درهم‌رفته با تقارن p622، Figure 14</title>
<desc id="d">بازسازی هندسی تحلیلی از Figure 14 مقالهٔ Makovicky 2023. نقش از شش‌ضلعی‌های درهم‌رفته روی محورهای شش‌گانه تشکیل شده و دو فاصلهٔ متناوب خطوط دارد. موقعیت روی پنل‌های ENE و WSW برج غربی است.</desc>
