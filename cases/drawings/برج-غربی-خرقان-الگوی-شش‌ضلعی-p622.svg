<text x="725" y="755" text-anchor="middle" class="tiny">دو مقیاسِ خطیِ متفاوت در این شیت به‌صورت دو شبکهٔ هم‌مرکز نمایش داده شده‌اند؛ فاصله‌ها و اندازه‌ها از عکس برداشت عددی نشده‌اند.</text>
