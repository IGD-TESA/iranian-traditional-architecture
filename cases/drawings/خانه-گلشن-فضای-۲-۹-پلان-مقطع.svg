<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="t d">
<title id="t">خانهٔ گلشن یزد، فضای ۲٫۹ — پلان و مقطع تحلیلی</title>
<desc id="d">بر پایهٔ Figure 15 و شرح مقالهٔ Zolfagharkhani و Foruzanmehr در 2024. بخش اصلی 4.8 در 4.3 متر با گنبد و نورگیر هشت‌ضلعی در رأس با ارتفاع 6.2 متر، بخش عقب 4.3 در 1.9 متر با کف 0.4 متر بالاتر، زیر بادگیر و با شبکهٔ چوبی بدون سقف سازه‌ای.</desc>
<defs><style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#cfc8ba;stroke-width:2}.h1{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:31px;font-weight:700;fill:#252b2e}.h2{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:22px;font-weight:700;fill:#30383c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#60686a}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#697174}.wall{fill:#e7e0d3;stroke:#343a3c;stroke-width:5}.room{fill:#fff;stroke:#4b5355;stroke-width:2.5}.dim{stroke:#795f3f;stroke-width:2;fill:none}.dash{stroke:#9a8062;stroke-width:2;stroke-dasharray:7 6;fill:none}.note{fill:#f1eee7;stroke:#c9c0b2;stroke-width:1.5}.wood{stroke:#9a6d3f;stroke-width:4}.step{fill:#ddd3c3;stroke:#665b4e;stroke-width:1.5}
</style></defs>
<rect width="1500" height="1000" class="bg"/>
<text x="750" y="52" text-anchor="middle" class="h1">خانهٔ گلشن، یزد — فضای ۲٫۹</text>
<text x="750" y="83" text-anchor="middle" class="body">بازترسیم تحلیلی پلان و مقطع از Figure 15 و شرح مقالهٔ ۲۰۲۴</text>
<rect x="45" y="120" width="710" height="700" rx="10" class="panel"/>
<text x="80" y="165" class="h2">۱. پلان فضای ۲٫۹</text>
<text x="80" y="192" class="small">دو بخش مستطیلی؛ ابعاد و اختلاف تراز گزارش‌شده</text>
<!-- main 4.8x4.3 at scale 60 px/m =288x258; rear 4.3x1.9 =258x114 -->
<rect x="190" y="300" width="288" height="258" class="wall"/>
<rect x="478" y="372" width="258" height="114" class="wall"/>
<rect x="204" y="314" width="260" height="230" class="room"/>
<rect x="492" y="386" width="230" height="86" class="room"/>
<text x="334" y="420" text-anchor="middle" class="body">بخش اصلی</text>
<text x="334" y="448" text-anchor="middle" class="small">زیر گنبد</text>
<polygon points="334,470 345,476 345,489 334,495 323,489 323,476" fill="none" stroke="#5f6b70" stroke-width="2"/>
<text x="607" y="426" text-anchor="middle" class="body">بخش عقب</text>
<text x="607" y="451" text-anchor="middle" class="small">زیر بادگیر</text>
<line x1="190" y1="275" x2="478" y2="275" class="dim"/>
<line x1="190" y1="263" x2="190" y2="287" class="dim"/>
<line x1="478" y1="263" x2="478" y2="287" class="dim"/>
<text x="334" y="264" text-anchor="middle" class="body">۴٫۸ متر</text>
<line x1="165" y1="300" x2="165" y2="558" class="dim"/>
<line x1="153" y1="300" x2="177" y2="300" class="dim"/>
<line x1="153" y1="558" x2="177" y2="558" class="dim"/>
<text x="139" y="430" transform="rotate(-90 139 430)" text-anchor="middle" class="body">۴٫۳ متر</text>
<line x1="478" y1="350" x2="736" y2="350" class="dim"/>
<line x1="478" y1="339" x2="478" y2="362" class="dim"/>
<line x1="736" y1="339" x2="736" y2="362" class="dim"/>
<text x="607" y="339" text-anchor="middle" class="small">۴٫۳ متر</text>
<line x1="760" y1="372" x2="760" y2="486" class="dim"/>
<line x1="748" y1="372" x2="772" y2="372" class="dim"/>
<line x1="748" y1="486" x2="772" y2="486" class="dim"/>
<text x="785" y="430" transform="rotate(90 785 430)" text-anchor="middle" class="small">۱٫۹ متر</text>
<text x="80" y="625" class="small">مساحت ترکیبی گزارش‌شده: ۲۸٫۷ مترمربع</text>
<text x="80" y="653" class="small">کف بخش عقب: ۰٫۴ متر بالاتر از کف بخش اصلی</text>
<text x="80" y="682" class="small">اتاق مجاور: حدود ۰٫۶ متر بالاتر از کف بخش اصلی؛ دو پله</text>
<text x="80" y="720" class="tiny">جهت و موقعیت نسبی اتاق مجاور در این جزئیاتِ مستقل بازسازی نشده است.</text>
<text x="80" y="748" class="tiny">ابعاد دو مستطیل از متن مقاله؛ ضخامت دیوار و محل دقیق بازشوها اندازه‌گذاری نشده‌اند.</text>

<rect x="785" y="120" width="670" height="700" rx="10" class="panel"/>
<text x="820" y="165" class="h2">۲. مقطع تحلیلی از دو بخش</text>
<text x="820" y="192" class="small">مقطع مفهومی؛ شکل دقیق گنبد از روی متن قابل اندازه‌گذاری نیست.</text>
<!-- main dome chamber -->
<rect x="890" y="520" width="300" height="250" class="wall"/>
<rect x="905" y="535" width="270" height="220" fill="#fff" stroke="#77746b" stroke-width="2"/>
<path d="M905 535 Q1040 250 1175 535" class="dash"/>
<polygon points="1040,250 1054,258 1054,274 1040,282 1026,274 1026,258" fill="#fff" stroke="#5a5550" stroke-width="2.5"/>
<line x1="1040" y1="250" x2="1040" y2="535" class="dash"/>
<text x="1065" y="252" class="small">نورگیر هشت‌ضلعی در رأس</text>
<line x1="1220" y1="250" x2="1220" y2="770" class="dim"/>
<line x1="1208" y1="250" x2="1232" y2="250" class="dim"/>
<line x1="1208" y1="770" x2="1232" y2="770" class="dim"/>
<text x="1247" y="510" transform="rotate(90 1247 510)" text-anchor="middle" class="body">۶٫۲ متر تا رأس گنبد</text>
<text x="1040" y="700" text-anchor="middle" class="body">بخش اصلی</text>
<!-- rear portion -->
<rect x="1190" y="545" width="170" height="225" fill="#f5f1e8" stroke="#343a3c" stroke-width="5"/>
<line x1="1190" y1="545" x2="1360" y2="545" stroke="#9a6d3f" stroke-width="5"/>
<line x1="1190" y1="557" x2="1360" y2="557" class="wood"/>
<line x1="1205" y1="540" x2="1205" y2="568" class="wood"/>
<line x1="1225" y1="540" x2="1225" y2="568" class="wood"/>
<line x1="1245" y1="540" x2="1245" y2="568" class="wood"/>
<line x1="1265" y1="540" x2="1265" y2="568" class="wood"/>
<line x1="1285" y1="540" x2="1285" y2="568" class="wood"/>
<line x1="1305" y1="540" x2="1305" y2="568" class="wood"/>
<line x1="1325" y1="540" x2="1325" y2="568" class="wood"/>
<line x1="1345" y1="540" x2="1345" y2="568" class="wood"/>
<text x="1275" y="640" text-anchor="middle" class="body">بخش عقب</text>
<text x="1275" y="666" text-anchor="middle" class="small">بدون سقف سازه‌ای</text>
<text x="1275" y="690" text-anchor="middle" class="small">شبکهٔ چوبی تزئینی</text>
<path d="M1275 535 L1275 455" class="dash"/>
<rect x="1225" y="410" width="100" height="45" fill="#d1c0a5" stroke="#68523d" stroke-width="2"/>
<text x="1275" y="438" text-anchor="middle" class="small">بادگیر</text>
<!-- floor levels -->
<line x1="875" y1="770" x2="1385" y2="770" stroke="#343a3c" stroke-width="4"/>
<line x1="1190" y1="746" x2="1360" y2="746" stroke="#795f3f" stroke-width="4"/>
<path d="M1190 770 H1215 V746 H1360" class="step"/>
<text x="890" y="795" class="small">کف اصلی +۰٫۰۰</text>
<text x="1190" y="730" class="small">کف بخش عقب +۰٫۴۰</text>
<text x="1355" y="715" class="small">کف اتاق مجاور +۰٫۶۰؛ دو پله از تراز اصلی</text>
<text x="820" y="790" class="tiny">خط پوستهٔ گنبد و ابعاد افقیِ مقطع شماتیک‌اند؛ فقط ارتفاع رأس و اختلاف ترازها عدد مستند دارند.</text>

<rect x="45" y="845" width="1410" height="100" rx="8" class="note"/>
<text x="80" y="882" class="body">دادهٔ منبع: بخش اصلی ۴٫۸ × ۴٫۳ متر؛ بخش عقب ۴٫۳ × ۱٫۹ متر؛ مساحت ترکیبی ۲۸٫۷ مترمربع؛ کف عقب +۰٫۴۰؛ ارتفاع رأس گنبد ۶٫۲ متر.</text>
<text x="80" y="914" class="small">بخش اصلی زیر گنبد و دارای نورگیر هشت‌ضلعی است؛ بخش عقب زیر بادگیر قرار دارد و سقف سازه‌ای ندارد، بلکه شبکهٔ چوبی تزئینی دارد.</text>
<text x="750" y="978" text-anchor="middle" class="tiny">Zolfagharkhani &amp; Foruzanmehr (2024), Figures 15–16, CC BY 4.0 — DOI: 10.3390/buildings14092639</text>
</svg>