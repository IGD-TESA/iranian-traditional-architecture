<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="t d">
<title id="t">بادگیر خانهٔ لاری‌ها، یزد — محدودهٔ پلان مستند</title>
<desc id="d">مستطیل خارجی بادگیر با طول ۶٫۱۹ و عرض ۳٫۵۹ متر طبق گزارش برداشت. تعداد شش کانال و تقسیمات داخلی مربع در متن گزارش شده‌اند اما مکان دقیق آن‌ها در این فایل ترسیم نشده است.</desc>
<defs><style>
.h{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:25px;font-weight:700;fill:#292722}
.s{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:16px;fill:#5c574e}
.d{font-family:Vazirmatn,Noto Sans Arabic,sans-serif;font-size:18px;fill:#775a39}
.w{fill:#eee7da;stroke:#292722;stroke-width:4}
.dim{stroke:#8d7251;stroke-width:2;fill:none}
</style></defs>
<rect width="920" height="620" fill="#fff"/>
<text x="460" y="43" text-anchor="middle" class="h">بادگیر خانهٔ لاری‌ها، یزد</text>
<text x="460" y="76" text-anchor="middle" class="s">محدودهٔ خارجیِ پلان بر اساس اندازه‌برداری گزارش‌شده در مقالهٔ ۲۰۲۴</text>
<rect x="140" y="155" width="619" height="359" class="w"/>
<line x1="140" y1="128" x2="759" y2="128" class="dim"/>
<line x1="140" y1="117" x2="140" y2="139" class="dim"/>
<line x1="759" y1="117" x2="759" y2="139" class="dim"/>
<text x="449" y="117" text-anchor="middle" class="d">۶٫۱۹ متر — طول پلان</text>
<line x1="795" y1="155" x2="795" y2="514" class="dim"/>
<line x1="784" y1="155" x2="807" y2="155" class="dim"/>
<line x1="784" y1="514" x2="807" y2="514" class="dim"/>
<text x="827" y="335" transform="rotate(90 827 335)" text-anchor="middle" class="d">۳٫۵۹ متر — عرض پلان</text>
<text x="449" y="315" text-anchor="middle" class="s">محدودهٔ خارجی بادگیر</text>
<text x="460" y="548" text-anchor="middle" class="s">مقاله شش کانال تهویه و تقسیمات داخلی مربع را گزارش می‌کند.</text>
<text x="460" y="575" text-anchor="middle" class="s">مکان و اندازهٔ کانال‌ها در این ترسیم بازسازی نشده؛ این نقشه فقط پوستهٔ مستطیلی را نشان می‌دهد.</text>
<text x="460" y="600" text-anchor="middle" class="s">Armanfar &amp; Akdeniz (2024), Fig. 7–8, DOI: 10.26835/my.1264810</text>
<a href="https://dergipark.org.tr/tr/download/article-file/3009428#page=19"><text x="460" y="616" text-anchor="middle" class="s">مشاهدهٔ مقاطع افقی و نقشه‌های منبع</text></a>
</svg>