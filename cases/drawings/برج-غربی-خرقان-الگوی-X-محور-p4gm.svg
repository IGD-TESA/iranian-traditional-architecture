</style></defs>
<rect width="1450" height="920" class="bg"/>
<text x="725" y="50" text-anchor="middle" class="h1">برج غربی خرقان — نقش Xمحورِ chopstick</text>
<text x="725" y="82" text-anchor="middle" class="body">گونهٔ p4gm در پنل ENE؛ بازنمایی هندسیِ منطق نقش، نه نقشهٔ اجرایی آجرچینی</text>
