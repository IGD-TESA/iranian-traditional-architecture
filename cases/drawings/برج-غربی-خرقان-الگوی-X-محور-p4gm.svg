<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="920" viewBox="0 0 1450 920" role="img" aria-labelledby="t d">
<title id="t">برج خرقان غربی — گونهٔ Xمحور chopstick با تقارن p4gm، Figure 11</title>
<desc id="d">طرح هندسی تفسیری بر اساس توصیف Figure 11 مقالهٔ Makovicky 2023. این نقش در پنل ENE برج غربی قرار دارد و از نوع X-based chopstick version of p4gm است. طرح، منطق تقارن را نشان می‌دهد نه جانمایی دقیق آجرهای اجراشده.</desc>
