<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="t d">
<title id="t">برج شرقی خرقان — بازسازی هندسی نقش هشت‌ضلعی‌های هم‌پوشان</title>
<desc id="d">بازسازی تحلیلی بر اساس شرح شکل ۱۲ مقالهٔ Makovicky 2023. نویسنده نقش دنده‌ای درهم‌تنیدهٔ برج شرقی را دارای تقارن لایه‌ای p422 و متشکل از هشت‌ضلعی‌های هم‌پوشان معرفی می‌کند؛ چهار به‌علاوه چهار هشت‌ضلعی برای هر هشت‌ضلعی مرکزی. این طرح یک مدل هندسی تفسیری است، نه برداشت اندازه‌دارِ بندهای آجر.</desc>
<defs><style>
.bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#c9c2b6;stroke-width:2}.h1{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:31px;font-weight:700;fill:#242a2d}.h2{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:22px;font-weight:700;fill:#30383c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#60686a}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#6a7275}.note{fill:#f1eee7;stroke:#c9c0b2;stroke-width:1.5}.axis{stroke:#8e8170;stroke-width:1.5;stroke-dasharray:6 6}
</style></defs>
<rect width="1500" height="980" class="bg"/>
<text x="750" y="52" text-anchor="middle" class="h1">برج شرقی خرقان — نقش دنده‌ایِ هشت‌ضلعی‌های هم‌پوشان</text>
<text x="750" y="83" text-anchor="middle" class="body">بازسازی هندسیِ تفسیری از Figure 12؛ الگوی واقعیِ همان پنل، نه نقش عمومی آجرکاری ایرانی</text>

<rect x="45" y="120" width="720" height="700" rx="10" class="panel"/>
<text x="80" y="165" class="h2">۱. خوانش هندسیِ سازوکار ۴ + ۴</text>
<text x="80" y="192" class="small">یک هشت‌ضلعی مرکزی و دو دستهٔ چهارگانهٔ هشت‌ضلعی‌های پیرامونی</text>
