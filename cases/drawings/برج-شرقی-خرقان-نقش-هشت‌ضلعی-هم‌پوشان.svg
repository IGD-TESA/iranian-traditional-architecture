<polygon points="551.6,333.1 506.1,378.6 441.9,378.6 396.4,333.1 396.4,268.9 441.9,223.4 506.1,223.4 551.6,268.9" fill="none" stroke="#6c5b49" stroke-width="3.2"/>
<polygon points="551.6,501.1 506.1,546.6 441.9,546.6 396.4,501.1 396.4,436.9 441.9,391.4 506.1,391.4 551.6,436.9" fill="none" stroke="#6c5b49" stroke-width="3.2"/>
<polygon points="383.6,501.1 338.1,546.6 273.9,546.6 228.4,501.1 228.4,436.9 273.9,391.4 338.1,391.4 383.6,436.9" fill="none" stroke="#6c5b49" stroke-width="3.2"/>
<polygon points="383.6,333.1 338.1,378.6 273.9,378.6 228.4,333.1 228.4,268.9 273.9,223.4 338.1,223.4 383.6,268.9" fill="none" stroke="#6c5b49" stroke-width="3.2"/>
<text x="390" y="628" text-anchor="middle" class="body">هشت‌ضلعی مرکزی</text>
<text x="390" y="658" text-anchor="middle" class="small">چهار موقعیت محوری + چهار موقعیت قطری</text>
<text x="390" y="688" text-anchor="middle" class="tiny">تقارن‌های چهارگانه و محورهای قطری در مدل هندسی نشان داده شده‌اند.</text>

<rect x="795" y="120" width="660" height="700" rx="10" class="panel"/>
<text x="830" y="165" class="h2">۲. پنل واقعیِ برج شرقی</text>
<text x="830" y="192" class="small">عکس منتشرشده در مقالهٔ Makovicky (2023)، Figure 12</text>
<image href="https://media.springernature.com/full/springer-static/image/art%3A10.1007%2Fs12210-023-01171-3/MediaObjects/12210_2023_1171_Fig12_HTML.jpg" x="840" y="225" width="575" height="360" preserveAspectRatio="xMidYMid meet"/>
<text x="840" y="620" class="small">شرح نویسنده: شبکهٔ دنده‌ایِ درهم‌تنیده با تقارن لایه‌ای p422؛</text>
<text x="840" y="645" class="small">رزت‌های چهارگوش، در اصل از هشت‌ضلعی‌های هم‌پوشان شکل گرفته‌اند.</text>
<a href="https://link.springer.com/article/10.1007/s12210-023-01171-3/figures/12"><text x="840" y="685" class="tiny">صفحهٔ رسمی Figure 12 و تصویر کامل</text></a>
<a href="https://doi.org/10.1007/s12210-023-01171-3"><text x="840" y="710" class="tiny">مقالهٔ کامل و تحلیل تقارن</text></a>

<rect x="45" y="845" width="1410" height="88" rx="8" class="note"/>
<text x="80" y="880" class="body">محدودیت: جایگاه و اندازهٔ واقعی هر آجر از این بازسازی هندسی به دست نمی‌آید؛ الگوی برداری، خوانش ریاضیِ توصیف نویسنده است.</text>
<text x="80" y="910" class="small">برای نقشهٔ اجراییِ بندها باید به برداشت آجر به آجر یا نقشهٔ CAD همان پنل مراجعه شود. این فایل، هندسهٔ مولد/تفسیری است نه رونوشت اندازه‌دار.</text>
<text x="750" y="967" text-anchor="middle" class="tiny">Makovicky (2023), Fig. 12, CC BY 4.0 — DOI: 10.1007/s12210-023-01171-3</text>
</svg>