<text x="650" y="735" text-anchor="middle" class="tiny">قطعهٔ بازترسیم‌شده برای نمایش منطق بندهای مورب و تکرار آجری؛ جهت، ابعاد آجر و مرز کل نقش نیازمند کنترل تصویر با وضوح بالاتر است.</text>
<rect x="55" y="800" width="1190" height="85" rx="8" class="note"/>
<text x="90" y="835" class="body">مبنای تاریخی: Figure 11، بخشی از آجرکاری نمای برج شرقی خرقان، ترسیم CAD در مقالهٔ Hassani &amp; Rafiee (2013).</text>
<text x="90" y="862" class="small">مقاله می‌گوید ترسیم آجرکاری فقط برای دو وجه از هشت وجه بنا تهیه شده است؛ این نمونه به همان قطعهٔ مستند محدود است و به همهٔ وجوه تعمیم ندارد.</text>
<text x="650" y="930" text-anchor="middle" class="tiny">Hassani &amp; Rafiee (2013), Figure 11 — CC BY 3.0 — DOI: 10.5194/isprsarchives-XL-5-W2-313-2013</text>
