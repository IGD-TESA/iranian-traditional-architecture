<title id="t">برج شرقی خرقان — قطعهٔ آجرکاری نمای ثبت‌شده در شکل ۱۱</title>
<desc id="d">بازترسیم تحلیلیِ بخشی از آرایهٔ آجری نمای برج شرقی خرقان از Figure 11 مقالهٔ Hassani و Rafiee در 2013. قطعه محدود به بخشی از نماست؛ اندازهٔ آجر، مقیاس و امتداد کامل نقش در مقاله اندازه‌گذاری نشده‌اند.</desc>
