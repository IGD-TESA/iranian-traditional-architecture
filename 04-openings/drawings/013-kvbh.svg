<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="ttl dsc">
<title id="ttl">کوبه — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی کوبه در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#9ca3af" stroke-width=".8"/></pattern></defs><rect width="640" height="430" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">کوبه</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<circle cx="320" cy="220" r="82" fill="#e7e5df" stroke="#252525" stroke-width="2"/><circle cx="320" cy="220" r="13" fill="#d6d3d1" stroke="#252525" stroke-width="1.5"/><path d="M320 205 C260 165 260 270 320 275 C380 270 380 165 320 205" fill="none" stroke="#252525" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
