<title id="ttl">در دولایه یا دارای لایهٔ درونی و بیرونی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی در دولایه یا دارای لایهٔ درونی و بیرونی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
