<title id="ttl">نورگیر بام — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی نورگیر بام در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
