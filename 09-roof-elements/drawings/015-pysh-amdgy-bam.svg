<title id="title">پیش‌آمدگی بام — ترسیم شماتیک بازبینی‌شده</title><desc id="desc">جزئیات مقطع لبهٔ بام که از خط خارجی دیوار جلوتر آمده و آب را از سطح نما دور می‌کند؛ اندازهٔ بیرون‌زدگی در نمونهٔ واقعی باید برداشت شود.</desc><rect width="640" height="430" fill="#fff"/>
