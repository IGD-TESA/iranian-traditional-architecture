<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="ttl dsc">
<title id="ttl">پوشش خرپشته‌ای یا دارای عناصر فوقانی (با تعیین مصداق) — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی پوشش خرپشته‌ای یا دارای عناصر فوقانی (با تعیین مصداق) در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#9ca3af" stroke-width=".8"/></pattern></defs><rect width="640" height="430" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">پوشش خرپشته‌ای یا دارای عناصر فوقانی …</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<rect x="120" y="200" width="400" height="145" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="1.5"/><rect x="260" y="90" width="120" height="110" rx="0" fill="#d6d3d1" stroke="#252525" stroke-width="2"/><path d="M280 185 V155 H305 V125 H330 V95" fill="none" stroke="#252525" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
</svg>