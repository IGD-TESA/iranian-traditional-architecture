<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">آجرکاری تزئینی در برج‌های خرقان؛ سه سازوکار</title><desc id="d">طبقه‌بندی پژوهش Makovicky 2023: آجرچینی تخت، نقش دنده‌ای، و نقش دنده‌ای پیچیده. دیاگرام‌ها مفهومی‌اند و نقشه اجرایی یک پنل نیستند.</desc>
<defs><style>
text{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#263238}.h{font-size:27px;font-weight:700}.s{font-size:15px;fill:#59666c}.p{fill:#fff;stroke:#c9c4ba;stroke-width:2}.brick{fill:#d8b79a;stroke:#6a5140;stroke-width:2}.rib{fill:#bd9270;stroke:#674b37;stroke-width:2}
</style></defs><rect width="1200" height="800" fill="#f8f7f3"/><rect x="25" y="20" width="1150" height="85" rx="10" fill="#293940"/><text x="600" y="58" class="h" fill="#fff" style="fill:#fff" text-anchor="middle">آجرکاری تزئینی در برج‌های خرقان — سه سازوکار</text><text x="600" y="85" class="s" style="fill:#e2e8eb" text-anchor="middle">طبقه‌بندی پژوهشی؛ نه گونه‌ای یکسان برای تمام معماری ایران</text>
<rect x="25" y="130" width="365" height="565" rx="8" class="p"/><text x="207" y="172" class="h" font-size="22" text-anchor="middle">۱ ـ آجرچینی تخت</text><text x="207" y="200" class="s" text-anchor="middle">Flat-brick pattern</text>
<rect x="65" y="235" width="285" height="205" fill="#efe8dc" stroke="#6a5140" stroke-width="2"/>
<g><rect x="68" y="238" width="85" height="38" class="brick"/><rect x="155" y="238" width="38" height="78" class="brick"/><rect x="195" y="238" width="85" height="38" class="brick"/><rect x="282" y="238" width="65" height="38" class="brick"/><rect x="68" y="278" width="38" height="78" class="brick"/><rect x="108" y="278" width="85" height="38" class="brick"/><rect x="195" y="278" width="38" height="78" class="brick"/><rect x="235" y="278" width="112" height="38" class="brick"/><rect x="68" y="358" width="85" height="38" class="brick"/><rect x="155" y="358" width="38" height="79" class="brick"/><rect x="195" y="358" width="85" height="38" class="brick"/><rect x="282" y="318" width="65" height="119" class="brick"/></g>
<text x="207" y="475" class="s" text-anchor="middle">آجرها در دو جهت ۹۰ درجه</text><text x="207" y="502" class="s" text-anchor="middle">آجرهای کشیده ۱:۲:۳؛ گاه</text><text x="207" y="529" class="s" text-anchor="middle">همراه آجر مربع</text><text x="207" y="592" class="s" text-anchor="middle">سطح کم‌برجستگی؛ نقش با</text><text x="207" y="619" class="s" text-anchor="middle">جهت‌گذاری آجرها ساخته می‌شود.</text>
<rect x="417" y="130" width="365" height="565" rx="8" class="p"/><text x="599" y="172" class="h" font-size="22" text-anchor="middle">۲ ـ نقش دنده‌ای</text><text x="599" y="200" class="s" text-anchor="middle">Rib pattern</text>
<rect x="457" y="235" width="285" height="205" fill="#eee9df" stroke="#8b7f70" stroke-width="2"/>
<path d="M472 430V290L496 266L520 290V430 M540 430V290L564 266L588 290V430 M608 430V290L632 266L656 290V430 M676 430V290L700 266L724 290V430" class="rib"/>
<text x="599" y="475" class="s" text-anchor="middle">آجرهای برجسته در کنار زمینه</text><text x="599" y="502" class="s" text-anchor="middle">فرورفته؛ تضاد نور و سایه نقش</text><text x="599" y="529" class="s" text-anchor="middle">سطح را شکل می‌دهد.</text><path d="M480 620H718V642H480Z" fill="#d8d0c2" stroke="#6a5140"/><path d="M495 620V570H519V620 M550 620V570H574V620 M605 620V570H629V620 M660 620V570H684V620" class="rib"/><text x="599" y="668" class="s" text-anchor="middle">مقطع مفهومی دنده و زمینه</text>
<rect x="809" y="130" width="365" height="565" rx="8" class="p"/><text x="991" y="172" class="h" font-size="22" text-anchor="middle">۳ ـ نقش دنده‌ای پیچیده</text><text x="991" y="200" class="s" text-anchor="middle">Loaded rib pattern</text>
<rect x="849" y="235" width="285" height="205" fill="#eee9df" stroke="#8b7f70" stroke-width="2"/>
<g fill="none" stroke="#674b37" stroke-width="8"><path d="M870 400L905 280L940 400L975 280L1010 400L1045 280L1112 400 M870 290L905 410L940 290L975 410L1010 290L1045 410L1112 290"/></g><g fill="none" stroke="#b48862" stroke-width="4"><path d="M870 240L1112 430M870 430L1112 240M930 240V430M1050 240V430"/></g>
<text x="991" y="475" class="s" text-anchor="middle">ترکیب چند خانوادهٔ نقش و دنده؛</text><text x="991" y="502" class="s" text-anchor="middle">پنل‌های بزرگ و چندعنصری.</text><text x="991" y="555" class="s" text-anchor="middle">اصطلاح loaded در مقاله به</text><text x="991" y="582" class="s" text-anchor="middle">پیچیدگی نقش دنده‌ای اشاره دارد،</text><text x="991" y="609" class="s" text-anchor="middle">نه به یک نقشهٔ اجرایی واحد.</text>
<rect x="25" y="720" width="1150" height="55" rx="7" fill="#eeeae1" stroke="#c9c1b3"/><text x="600" y="752" class="s" text-anchor="middle">طبقه‌بندی استخراج‌شده از برج‌های خرقان؛ شکل‌ها دیاگرام توضیحی‌اند، نه بازسازی بند و رج یک پنل مشخص. Makovicky (2023), DOI: 10.1007/s12210-023-01171-3, CC BY 4.0.</text>
</svg>