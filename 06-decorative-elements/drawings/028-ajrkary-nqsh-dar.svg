<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">آجرکاری نقش‌دار خرقان؛ سه پنل و گروه تقارن</title><desc id="d">مقایسه نقش Xمحور p4gm در پنل ENE برج غربی، شش‌ضلعی‌های درهم‌رفته p622 در پنل‌های ENE و WSW برج غربی، و هشت‌ضلعی‌های هم‌پوشان p422 در برج شرقی. هندسه تفسیری است نه بازسازی رج‌های اجرایی.</desc>
<defs><style>text{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#263238}.h{font-size:25px;font-weight:700}.s{font-size:14px;fill:#59666c}.p{fill:#fff;stroke:#c9c4ba;stroke-width:2}.a{stroke:#6e513d;stroke-width:6;fill:none;stroke-linejoin:round}.b{stroke:#b48862;stroke-width:3;fill:none}.axis{stroke:#a69a8a;stroke-width:1.2;stroke-dasharray:5 5}</style></defs>
<rect width="1200" height="800" fill="#f8f7f3"/><rect x="25" y="20" width="1150" height="85" rx="10" fill="#293940"/><text x="600" y="58" class="h" style="fill:#fff" text-anchor="middle">آجرکاری نقش‌دار در برج‌های خرقان — سه پنل مستند</text><text x="600" y="85" class="s" style="fill:#e2e8eb" text-anchor="middle">گروه تقارن، جایگاه واقعی و منطق هندسی هر نمونه</text>
<rect x="25" y="130" width="365" height="555" rx="8" class="p"/><text x="207" y="170" class="h" font-size="21" text-anchor="middle">۱ ـ نقش Xمحور</text><text x="207" y="198" class="s" text-anchor="middle">p4gm · Fig. 11</text><text x="207" y="222" class="s" text-anchor="middle">برج غربی، پنل ENE</text><rect x="65" y="245" width="285" height="235" fill="#f1ece2" stroke="#c9c0b2"/><g transform="translate(207 360)"><path class="a" d="M-120 -80L-60 -40L0 0L60 40L120 80 M-120 80L-60 40L0 0L60 -40L120 -80 M-120 0L-60 -40L0 0L60 40L120 0 M-120 0L-60 40L0 0L60 -40L120 0"/><path class="b" d="M-120 -80V80M0 -100V100M120 -80V80M-120 -80H120M-120 80H120"/><path class="axis" d="M0 -105V105M-135 0H135"/></g><text x="207" y="515" class="s" text-anchor="middle">X-based “chopstick” pattern</text><text x="207" y="542" class="s" text-anchor="middle">بازسازی منطق تقارن؛ نه آجر به آجر.</text><text x="207" y="615" class="s" text-anchor="middle">Makovicky 2023، Figure 11</text><text x="207" y="641" class="s" text-anchor="middle">تقارن صفحه‌ای p4gm</text>
<rect x="417" y="130" width="365" height="555" rx="8" class="p"/><text x="599" y="170" class="h" font-size="21" text-anchor="middle">۲ ـ شش‌ضلعی‌های درهم‌رفته</text><text x="599" y="198" class="s" text-anchor="middle">p622 · Fig. 14</text><text x="599" y="222" class="s" text-anchor="middle">برج غربی، پنل‌های ENE و WSW</text><rect x="457" y="245" width="285" height="235" fill="#f1ece2" stroke="#c9c0b2"/><g transform="translate(599 360)"><g class="a"><polygon points="0,-88 76,-44 76,44 0,88 -76,44 -76,-44"/><polygon points="76,-44 152,0 152,88 76,132 0,88 0,0" transform="translate(-76 -44)"/><polygon points="-76,-44 0,0 0,88 -76,132 -152,88 -152,0" transform="translate(76 -44)"/></g><g class="b"><polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"/></g><path class="axis" d="M-130 0H130M-65 -112L65 112M-65 112L65 -112"/></g><text x="599" y="515" class="s" text-anchor="middle">دو فاصلهٔ متناوب خطوط</text><text x="599" y="542" class="s" text-anchor="middle">شبکهٔ شش‌ضلعیِ دولایه</text><text x="599" y="615" class="s" text-anchor="middle">Makovicky 2023، Figure 14</text><text x="599" y="641" class="s" text-anchor="middle">گروه لایه‌ای p622</text>
<rect x="809" y="130" width="365" height="555" rx="8" class="p"/><text x="991" y="170" class="h" font-size="21" text-anchor="middle">۳ ـ هشت‌ضلعی‌های هم‌پوشان</text><text x="991" y="198" class="s" text-anchor="middle">p422 · Fig. 12</text><text x="991" y="222" class="s" text-anchor="middle">برج شرقی خرقان</text><rect x="849" y="245" width="285" height="235" fill="#f1ece2" stroke="#c9c0b2"/><g transform="translate(991 360)" fill="none" stroke-linejoin="round"><polygon points="0,-76 54,-54 76,0 54,54 0,76 -54,54 -76,0 -54,-54" class="b"/><g class="a"><polygon points="0,-112 30,-92 43,-40 30,-10 0,9 -30,-10 -43,-40 -30,-92"/><polygon points="80,-80 110,-60 123,-8 110,22 80,41 50,22 37,-8 50,-60"/><polygon points="112,0 142,20 155,72 142,102 112,121 82,102 69,72 82,20"/><polygon points="80,80 110,100 123,152 110,182 80,201 50,182 37,152 50,100"/><polygon points="0,112 30,92 43,40 30,10 0,-9 -30,10 -43,40 -30,92" transform="rotate(180)"/><polygon points="-80,80 -50,60 -37,8 -50,-22 -80,-41 -110,-22 -123,8 -110,60"/><polygon points="-112,0 -82,-20 -69,-72 -82,-102 -112,-121 -142,-102 -155,-72 -142,-20"/><polygon points="-80,-80 -50,-60 -37,-8 -50,22 -80,41 -110,22 -123,-8 -110,-60"/></g></g><text x="991" y="515" class="s" text-anchor="middle">۴+۴ هشت‌ضلعی پیرامون مرکزی</text><text x="991" y="542" class="s" text-anchor="middle">رزت چهارگوش ظاهری از هم‌پوشانی دنده‌ها</text><text x="991" y="615" class="s" text-anchor="middle">Makovicky 2023، Figure 12</text><text x="991" y="641" class="s" text-anchor="middle">گروه لایه‌ای p422</text>
<rect x="25" y="710" width="1150" height="60" rx="7" fill="#eeeae1" stroke="#c9c1b3"/><text x="600" y="737" class="s" text-anchor="middle">سه شکل، بازسازی هندسیِ منطق تقارن‌اند؛ ابعاد آجرها و بندهای اجرایی را بازسازی نمی‌کنند.</text><text x="600" y="758" class="s" text-anchor="middle">Makovicky (2023), Rendiconti Lincei 34, 703–720, Figures 11, 12, 14. DOI: 10.1007/s12210-023-01171-3 · CC BY 4.0.</text>
</svg>