<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="820" viewBox="0 0 1250 820" role="img" aria-labelledby="title desc">
<title id="title">مقرنس؛ واحدهای هندسی و سازمان لایه‌ای</title>
<desc id="desc">دیاگرام تحلیلی از واحدهای هندسی مورد استفاده در نقشهٔ مقرنس، مفهوم سلول و عنصر واسط، و نمونهٔ یک ردیف متشکل از چهار سلول و سه عنصر واسط. این تصویر بازسازی مقرنس یک بنای تاریخی مشخص نیست.</desc>
<defs><style>
 .unit{fill:#d8c4a4;stroke:#5b4832;stroke-width:2.5;stroke-linejoin:round}
 .unit2{fill:#eee5d5;stroke:#5b4832;stroke-width:2.5;stroke-linejoin:round}
 .edge{fill:none;stroke:#5b4832;stroke-width:2}
 .light{fill:#f8f5ee;stroke:#5b4832;stroke-width:2}
 .label{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#282824;font-size:18px}
 .small{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#5b574e;font-size:14px}
 .head{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#282824;font-size:23px;font-weight:700}
 .panel{fill:#fbfaf7;stroke:#cfc8bc;stroke-width:1.5}
</style></defs>
<rect width="1250" height="820" fill="#fff"/>
<text x="625" y="42" text-anchor="middle" class="head" font-size="28">مقرنس؛ از واحد هندسی تا ردیف سه‌بعدی</text>
<text x="625" y="72" text-anchor="middle" class="small">بازسازی تحلیلیِ منطق مدولار؛ برای ترسیم مقرنس یک بنا باید هندسهٔ واقعی همان نمونه برداشت شود.</text>
<rect x="30" y="105" width="380" height="600" rx="8" class="panel"/>
<rect x="430" y="105" width="390" height="600" rx="8" class="panel"/>
<rect x="840" y="105" width="380" height="600" rx="8" class="panel"/>
<text x="220" y="145" text-anchor="middle" class="head">۱. اجزای هندسی در پلان</text>
<text x="625" y="145" text-anchor="middle" class="head">۲. سلول و عنصر واسط</text>
<text x="1030" y="145" text-anchor="middle" class="head">۳. ترکیب یک ردیف</text>
<!-- geometry primitives -->
<rect x="75" y="205" width="78" height="78" class="unit"/>
<text x="114" y="310" text-anchor="middle" class="small">مربع</text>
<polygon points="250,195 315,242 250,289 185,242" class="unit2"/>
<text x="250" y="310" text-anchor="middle" class="small">لوزی</text>
<path d="M80 395 L158 395 L158 473 L80 473 Z" class="unit"/>
<path d="M80 395 L158 473" class="edge"/>
<text x="119" y="500" text-anchor="middle" class="small">نیم‌مربع</text>
<path d="M250 390 Q315 425 250 475 Q185 425 250 390 Z" class="unit2"/>
<text x="250" y="500" text-anchor="middle" class="small">لوزی / بادامی</text>
<polygon points="120,555 158,555 178,575 178,613 158,633 120,633 100,613 100,575" class="light"/>
<path d="M100 575 L178 613" class="edge"/>
<text x="139" y="665" text-anchor="middle" class="small">ترکیب چندضلعی</text>
<text x="270" y="600" text-anchor="middle" class="small">واحدها و نام‌گذاری دقیق</text>
<text x="270" y="623" text-anchor="middle" class="small">بر اساس نقشهٔ همان مقرنس</text>

<!-- cell and intermediate component axonometric -->
<path d="M490 300 L565 260 L650 300 L575 345 Z" class="unit"/>
<path d="M490 300 L575 345 L575 420 L490 375 Z" class="unit2"/>
<path d="M575 345 L650 300 L650 375 L575 420 Z" class="unit"/>
<path d="M490 300 L565 260 L650 300" class="edge"/>
<path d="M575 345 L575 420" class="edge"/>
<text x="570" y="455" text-anchor="middle" class="label">سلول / واحد فرورونده</text>
<path d="M500 535 L560 500 L625 535 L565 570 Z" class="unit2"/>
<path d="M500 535 L565 570 L565 625 L500 590 Z" class="unit"/>
<path d="M565 570 L625 535 L625 590 L565 625 Z" class="unit2"/>
<text x="565" y="660" text-anchor="middle" class="label">عنصر واسط</text>
<text x="625" y="690" text-anchor="middle" class="small">فرم واقعی سلول‌ها در نمونه‌ها متنوع است.</text>

<!-- tier of four cells and 3 intermediates -->
<g transform="translate(865,0)">
 <path d="M20 365 L75 330 L130 365 L75 400 Z" class="unit"/>
 <path d="M20 365 L75 400 L75 465 L20 430 Z" class="unit2"/>
 <path d="M75 400 L130 365 L130 430 L75 465 Z" class="unit"/>
 <path d="M110 365 L165 330 L220 365 L165 400 Z" class="unit2"/>
 <path d="M110 365 L165 400 L165 465 L110 430 Z" class="unit"/>
 <path d="M165 400 L220 365 L220 430 L165 465 Z" class="unit2"/>
 <path d="M200 365 L255 330 L310 365 L255 400 Z" class="unit"/>
 <path d="M200 365 L255 400 L255 465 L200 430 Z" class="unit2"/>
 <path d="M255 400 L310 365 L310 430 L255 465 Z" class="unit"/>
 <path d="M20 330 L75 295 L130 330 L75 365 Z" class="unit2"/>
 <path d="M110 330 L165 295 L220 330 L165 365 Z" class="unit"/>
 <path d="M200 330 L255 295 L310 330 L255 365 Z" class="unit2"/>
 <path d="M20 430 L75 465 L130 430 M110 430 L165 465 L220 430 M200 430 L255 465 L310 430" class="edge"/>
 <text x="165" y="510" text-anchor="middle" class="label">چهار سلول + سه عنصر واسط</text>
 <text x="165" y="538" text-anchor="middle" class="small">نمونهٔ یک ردیف مدولار</text>
 <path d="M45 590 L90 560 L135 590 L90 620 Z" class="unit"/>
 <path d="M90 620 L135 590 L135 640 L90 670 Z" class="unit2"/>
 <path d="M45 590 L90 620 L90 670 L45 640 Z" class="unit2"/>
 <path d="M45 590 L90 560 L135 590" class="edge"/>
 <text x="165" y="690" text-anchor="middle" class="small">اتصال ردیف‌ها و لایه‌ها تابع هندسهٔ نمونه است.</text>
</g>
<text x="625" y="770" text-anchor="middle" class="small">سطح اعتبار: T1 | مبنا: “A Framework for 3D Pattern Analysis and Reconstruction of Persian Architectural Elements”, DOI:10.1007/s00004-015-0287-z؛ شکل‌ها مفهومی‌اند، نه بازسازی مقرنس مسجد شاه.</text>
</svg>