<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="ttl dsc">
<title id="ttl">آب‌انبار — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی آب‌انبار در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
