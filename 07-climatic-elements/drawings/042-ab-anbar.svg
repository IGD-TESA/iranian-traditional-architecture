<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<rect x="120" y="110" width="400" height="240" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="1.5"/><line x1="170" y1="125" x2="170" y2="325" stroke="#285b78" stroke-width="2" stroke-dasharray="5 5"/><line x1="470" y1="125" x2="470" y2="325" stroke="#285b78" stroke-width="2" stroke-dasharray="5 5"/><path d="M170 300 H470" fill="none" stroke="#285b78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
