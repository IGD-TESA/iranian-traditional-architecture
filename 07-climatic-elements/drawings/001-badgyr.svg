<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">بادگیر چندوجهی؛ بازسازی گونهٔ هشت‌وجهی</title>
<desc id="desc">ترسیم تحلیلی بادگیر چندوجهی با پلان هشت‌وجهی، دهانه‌های پیرامونی، تیغهٔ داخلی و مجرای اتصال به فضای زیرین. بادگیرها از نظر مقطع، تعداد دهانه و تیغه‌بندی تنوع منطقه‌ای دارند؛ این تصویر گونهٔ مستندشدهٔ یک بنای مشخص نیست.</desc>
<defs><style>
 .masonry{fill:#d9c7a8;stroke:#4a3b2b;stroke-width:4;stroke-linejoin:round}
 .cut{fill:#f8f5ed;stroke:#4a3b2b;stroke-width:3}
 .air{fill:none;stroke:#287e91;stroke-width:4;stroke-linecap:round}
 .return{fill:none;stroke:#b66b35;stroke-width:3;stroke-dasharray:7 5}
 .label{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#282824;font-size:18px}
 .small{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#5b574e;font-size:14px}
 .head{font-family:Vazirmatn,'Noto Naskh Arabic',sans-serif;fill:#282824;font-size:23px;font-weight:700}
 .panel{fill:#fbfaf7;stroke:#cfc8bc;stroke-width:1.5}
</style><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#287e91" stroke-width="1.8"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#b66b35" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" class="head" font-size="28">بادگیر چندوجهی؛ گونهٔ هشت‌وجهی</text>
<text x="600" y="71" text-anchor="middle" class="small">بازسازی تحلیلیِ فرم و منطق مجراها؛ بادگیرهای ایران از نظر شکل پلان و تعداد دهانه گونه‌های متنوع دارند.</text>
<rect x="30" y="100" width="390" height="590" rx="8" class="panel"/>
<rect x="440" y="100" width="730" height="350" rx="8" class="panel"/>
<rect x="440" y="470" width="730" height="220" rx="8" class="panel"/>
<text x="225" y="140" text-anchor="middle" class="head">۱. پلان برج</text>
<text x="805" y="140" text-anchor="middle" class="head">۲. نما و مقطع اتصال به بنا</text>
<text x="805" y="510" text-anchor="middle" class="head">۳. مسیر عملکردی هوا</text>
<!-- octagonal plan -->
<polygon points="170,205 280,205 355,280 355,390 280,465 170,465 95,390 95,280" class="masonry"/>
<!-- central shaft -->
<polygon points="170,250 280,250 310,280 310,390 280,420 170,420 140,390 140,280" class="cut"/>
<!-- inner baffle wall -->
<path d="M225 250 V420 M140 335 H310" stroke="#8c7150" stroke-width="13"/>
<path d="M225 260 V410 M150 335 H300" stroke="#fff" stroke-width="3"/>
<!-- vents -->
<g fill="#fff" stroke="#4a3b2b" stroke-width="2">
 <rect x="210" y="196" width="30" height="18"/><rect x="345" y="320" width="18" height="30"/>
 <rect x="210" y="456" width="30" height="18"/><rect x="87" y="320" width="18" height="30"/>
 <rect x="130" y="235" width="22" height="18"/><rect x="298" y="235" width="22" height="18"/>
 <rect x="298" y="416" width="22" height="18"/><rect x="130" y="416" width="22" height="18"/>
</g>
<path d="M170 230 L170 275 L205 310" class="air" marker-end="url(#blue)"/>
<path d="M280 435 L280 395 L245 360" class="return" marker-end="url(#orange)"/>
<text x="225" y="535" text-anchor="middle" class="label">مقطع هشت‌وجهی با تیغهٔ داخلی</text>
<text x="225" y="563" text-anchor="middle" class="small">ترتیب واقعی تیغه‌ها و کانال‌ها</text>
<text x="225" y="585" text-anchor="middle" class="small">باید از نمونهٔ مشخص برداشت شود.</text>
<text x="225" y="620" text-anchor="middle" class="small">دهانه‌ها در یک یا چند جبهه</text>
<text x="225" y="642" text-anchor="middle" class="small">و تا هشت جهت گزارش شده‌اند.</text>

<!-- section tower -->
<line x1="500" y1="302" x2="1110" y2="302" stroke="#725f43" stroke-width="8"/>
<rect x="690" y="165" width="185" height="137" class="masonry"/>
<path d="M690 210 H875 M690 235 H875" stroke="#4a3b2b" stroke-width="2"/>
<rect x="730" y="302" width="105" height="112" fill="#d8c8aa" stroke="#4a3b2b" stroke-width="3"/>
<rect x="835" y="302" width="250" height="112" fill="#f1ead8" stroke="#4a3b2b" stroke-width="3"/>
<path d="M730 165 L730 115 M835 165 L835 115" stroke="#4a3b2b" stroke-width="3"/>
<rect x="730" y="145" width="105" height="20" fill="#b78a57" stroke="#4a3b2b" stroke-width="2"/>
<!-- airflow channels -->
<path d="M710 185 H815 V295 V372 H1020" class="air" marker-end="url(#blue)"/>
<path d="M1040 385 H860 V275 V190 H850" class="return" marker-end="url(#orange)"/>
<text x="785" y="200" text-anchor="middle" class="small">برج آجری و دهانه‌های بادگیر</text>
<text x="785" y="340" text-anchor="middle" class="small">مجرای قائم</text>
<text x="963" y="350" text-anchor="middle" class="label">فضای زیرین / اتاق یا مخزن</text>
<text x="963" y="380" text-anchor="middle" class="small">اتصال مجرا به فضای مورد تهویه</text>
<text x="805" y="430" text-anchor="middle" class="small">مسیرها فقط نمونهٔ عملکردی‌اند؛ جهت جریان تابع باد غالب، فشار و وضعیت خروجی‌هاست.</text>

<!-- functional diagram -->
<path d="M520 600 H700 V550 H880 V600 H1080" fill="none" stroke="#d9c7a8" stroke-width="30" stroke-linejoin="round"/>
<path d="M520 600 H700 V550 H880 V600 H1080" class="air" marker-end="url(#blue)"/>
<path d="M1080 645 H880 V620 H700 V645 H520" class="return" marker-end="url(#orange)"/>
<text x="610" y="575" text-anchor="middle" class="small">ورود از دهانهٔ بادگیر</text>
<text x="980" y="575" text-anchor="middle" class="small">تخلیه / خروج، بسته به آرایش واقعی</text>
<text x="805" y="665" text-anchor="middle" class="small">سطح اعتبار: T1 | منبع: Encyclopaedia Iranica, “BĀDGĪR”; Yousefi &amp; Nocera, Heritage 4(4), 219 (2021), Fig. 4 and section 3.2.4</text>
</svg>