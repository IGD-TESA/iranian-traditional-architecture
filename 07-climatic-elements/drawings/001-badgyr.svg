<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" role="img" aria-labelledby="title desc">
<title id="title">بادگیر خانهٔ لاری‌ها در یزد؛ پلان اندازه‌دار و داده‌های مستند</title>
<desc id="desc">بازترسیم محدود و داده‌محور از بادگیر خانهٔ لاری‌ها بر پایهٔ مقالهٔ برداشت میدانی Armanfar و Akdeniz در سال ۲۰۲۴. پلان خارجی مستطیل به ابعاد ۶٫۱۹ در ۳٫۵۹ متر نشان داده شده است. شش کانال تهویه، ارتفاع‌های گزارش‌شده، جایگاه نسبت به ایوان و مسیر عملکرد ثبت شده‌اند. آرایش داخلی کانال‌ها و جزئیات نمایی که از سند به‌طور دقیق قابل ردیابی نبوده‌اند، بازسازی نشده‌اند.</desc>
<defs>
  <pattern id="masonry" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#a8a29e" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#275d78"/></marker>
  <marker id="dim" markerWidth="8" height="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#35424a"/></marker>
  <style>
    .bg{fill:#fff}
    .panel{fill:#fff;stroke:#c7cbd0;stroke-width:1.6}
    .head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:25px;font-weight:700;fill:#20252b}
    .sub{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#48545d}
    .label{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:19px;fill:#20252b}
    .small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:15px;fill:#53616b}
    .tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:13px;fill:#68737c}
    .dimline{stroke:#35424a;stroke-width:1.7;fill:none;marker-start:url(#dim);marker-end:url(#dim)}
    .ext{stroke:#65717b;stroke-width:1.2;fill:none}
    .flow{stroke:#275d78;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .wall{fill:url(#masonry);stroke:#252b30;stroke-width:2.4}
  </style>
</defs>
<rect class="bg" width="1320" height="980"/>
<rect x="28" y="25" width="1264" height="105" rx="10" fill="#28343b"/>
<text x="660" y="68" text-anchor="middle" direction="rtl" class="head" fill="#fff" style="fill:#fff">بادگیر خانهٔ لاری‌ها — یزد</text>
<text x="660" y="101" text-anchor="middle" direction="rtl" class="sub" style="fill:#e5e7eb">بازترسیم محدود بر پایهٔ داده‌های برداشت میدانی؛ نه گونهٔ عمومی بادگیرهای ایران</text>

<!-- DIMENSIONED PLAN -->
<rect class="panel" x="35" y="155" width="620" height="420" rx="8"/>
<text x="345" y="193" text-anchor="middle" direction="rtl" class="head">۱ ـ پلان محدودهٔ خارجی بادگیر</text>
<text x="345" y="220" text-anchor="middle" direction="rtl" class="small">نسبت طول به عرض بر اساس ابعاد گزارش‌شده</text>
<!-- Plan rectangle: proportion 6.19 / 3.59 = 1.724 -->
<rect x="170" y="270" width="345" height="200" class="wall"/>
<rect x="183" y="283" width="319" height="174" fill="#fff" stroke="#64717a" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="342" y="355" text-anchor="middle" direction="rtl" class="label">محدودهٔ خارجی</text>
<text x="342" y="383" text-anchor="middle" direction="rtl" class="small">تقسیمات داخلی مربع توصیف شده‌اند؛</text>
<text x="342" y="406" text-anchor="middle" direction="rtl" class="small">آرایش دقیق آن‌ها در این پلان بازسازی نشده است.</text>
<!-- horizontal dimension -->
<path d="M170 254V238 M515 254V238" class="ext"/>
<path d="M170 244H515" class="dimline"/>
<rect x="285" y="228" width="115" height="28" fill="#fff"/>
<text x="342" y="249" text-anchor="middle" class="label">۶٫۱۹ متر</text>
<!-- vertical dimension -->
<path d="M532 270H550 M532 470H550" class="ext"/>
<path d="M543 270V470" class="dimline"/>
<rect x="545" y="342" width="90" height="32" fill="#fff"/>
<text x="589" y="365" text-anchor="middle" direction="rtl" class="small">۳٫۵۹ م</text>
<text x="345" y="520" text-anchor="middle" direction="rtl" class="small">پلانِ خارجی مستطیل؛ بدون نمایشِ جای کانال‌ها یا دیوارهای داخلیِ حدس‌زده‌شده</text>
<text x="345" y="548" text-anchor="middle" direction="rtl" class="tiny">منبع: Armanfar &amp; Akdeniz, 2024، ص. چاپی ۱۰۵، شرح شکل ۷</text>

<!-- HEIGHT DATA -->
<rect class="panel" x="680" y="155" width="605" height="420" rx="8"/>
<text x="982" y="193" text-anchor="middle" direction="rtl" class="head">۲ ـ داده‌های ارتفاعیِ گزارش‌شده</text>
<text x="982" y="222" text-anchor="middle" direction="rtl" class="small">دو اندازه‌گیری با دو مبدأ متفاوت؛ جدا از یکدیگر ثبت می‌شوند</text>
<rect x="735" y="260" width="495" height="105" rx="7" fill="#f1f5f7" stroke="#9aa7af"/>
<text x="982" y="299" text-anchor="middle" direction="rtl" class="label">از سطح بام تا رأس بادگیر</text>
<text x="982" y="343" text-anchor="middle" class="head" style="font-size:34px;fill:#275d78">۱۰٫۸۶ متر</text>
<rect x="735" y="390" width="495" height="105" rx="7" fill="#f1f5f7" stroke="#9aa7af"/>
<text x="982" y="429" text-anchor="middle" direction="rtl" class="label">از کف اتاق بادگیر تا رأس</text>
<text x="982" y="473" text-anchor="middle" class="head" style="font-size:34px;fill:#275d78">۱۹٫۷۴ متر</text>
<text x="982" y="530" text-anchor="middle" direction="rtl" class="tiny">ترازهای جزئی شکل ۸ در مقاله درج شده‌اند؛ تا تطبیق مستقیم خطوط و مبدأها،</text>
<text x="982" y="552" text-anchor="middle" direction="rtl" class="tiny">به شکلِ مقطعِ تازه تبدیل نشده‌اند.</text>

<!-- SPATIAL RELATION -->
<rect class="panel" x="35" y="600" width="620" height="285" rx="8"/>
<text x="345" y="638" text-anchor="middle" direction="rtl" class="head">۳ ـ جایگاه در بخش تابستان‌نشین</text>
<text x="345" y="666" text-anchor="middle" direction="rtl" class="small">رابطهٔ فضاییِ گزارش‌شده؛ دیاگرام شماتیک و فاقد مقیاس</text>
<rect x="92" y="710" width="160" height="90" rx="5" fill="#e9edf0" stroke="#34424a" stroke-width="2"/>
<text x="172" y="748" text-anchor="middle" direction="rtl" class="label">اتاق بادگیر</text>
<text x="172" y="775" text-anchor="middle" direction="rtl" class="tiny">جبههٔ جنوبی</text>
<path d="M255 755H320" class="flow"/>
<text x="287" y="733" text-anchor="middle" direction="rtl" class="tiny">گذرگاه کوچک</text>
<rect x="325" y="710" width="135" height="90" rx="5" fill="#e9edf0" stroke="#34424a" stroke-width="2"/>
<text x="392" y="760" text-anchor="middle" direction="rtl" class="label">ایوان باز</text>
<path d="M463 755H520" class="flow"/>
<rect x="525" y="710" width="95" height="90" rx="5" fill="#eef3e9" stroke="#657b55" stroke-width="2"/>
<text x="572" y="760" text-anchor="middle" direction="rtl" class="label">حیاط</text>
<text x="345" y="842" text-anchor="middle" direction="rtl" class="tiny">بادگیر پشت ایوان قرار دارد؛ گذرگاه کوچک میان اتاق بادگیر و ایوان گزارش شده است.</text>

<!-- AIRFLOW & CHANNELS -->
<rect class="panel" x="680" y="600" width="605" height="285" rx="8"/>
<text x="982" y="638" text-anchor="middle" direction="rtl" class="head">۴ ـ کانال‌ها و مسیر عملکرد</text>
<rect x="725" y="680" width="240" height="65" rx="6" fill="#eaf2f6" stroke="#6c8796"/>
<text x="845" y="707" text-anchor="middle" direction="rtl" class="label">۶ کانال تهویه</text>
<text x="845" y="731" text-anchor="middle" direction="rtl" class="tiny">تعداد مستند؛ موقعیت دقیق ترسیم نشده</text>
<path d="M970 713H1035" class="flow"/>
<rect x="1040" y="680" width="190" height="65" rx="6" fill="#eaf2f6" stroke="#6c8796"/>
<text x="1135" y="707" text-anchor="middle" direction="rtl" class="label">ورود هوا از بالا</text>
<text x="1135" y="731" text-anchor="middle" direction="rtl" class="tiny">و هدایت به پایین</text>
<path d="M845 750V783H930" class="flow"/>
<path d="M845 750V820H1065" class="flow"/>
<text x="967" y="779" text-anchor="middle" direction="rtl" class="tiny">بخشی به ایوان</text>
<text x="1110" y="816" text-anchor="middle" direction="rtl" class="tiny">بخشی به اتاق خنک</text>
<text x="982" y="855" text-anchor="middle" direction="rtl" class="tiny">زیر این بادگیر، قنات/کریز گزارش نشده است؛ هوای گرم از ایوان به حیاط تخلیه می‌شود.</text>

<line x1="35" y1="910" x2="1285" y2="910" stroke="#c7cbd0"/>
<text x="660" y="938" text-anchor="middle" direction="rtl" class="small">مصالح گزارش‌شده: آجر، خاک رس و چوب؛ تقسیمات و کانال‌های داخلی: گچ</text>
<text x="660" y="963" text-anchor="middle" direction="rtl" class="tiny">Armanfar, A. &amp; Akdeniz, M. G. (2024), Mimarlık ve Yaşam, 9(1), 87–113, DOI: 10.26835/my.1264810 — صفحات چاپی ۱۰۵ تا ۱۰۷، شکل‌های ۷ و ۸</text>
</svg>