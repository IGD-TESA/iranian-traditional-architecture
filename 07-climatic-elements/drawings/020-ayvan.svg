<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1000" viewBox="0 0 1360 1000" role="img" aria-labelledby="t desc">
<title id="t">ایوان تابستانی و بادگیر خانهٔ لاری‌ها؛ رابطهٔ فضایی و مسیر تهویه</title>
<desc id="desc">دیاگرام مستند بر اساس شکل‌های ۳ و ۶ مقالهٔ Armanfar و Akdeniz 2024 دربارهٔ خانهٔ لاری‌ها. بادگیر در پشت ایوان و در جبههٔ جنوبی بخش تابستان‌نشین قرار دارد؛ میان اتاق بادگیر و ایوان گذرگاهی کوچک است. هوا از بالای بادگیر گرفته و به فضای داخلی هدایت می‌شود؛ هوای گرم از ایوان باز به حیاط تخلیه می‌شود. شش کانال در بادگیر گزارش شده، اما محل دقیق آن‌ها در این دیاگرام ترسیم نشده است. ایوان فقط به عنوان فضای باز توصیف شده؛ پوشش و فرم هندسی آن در این ترسیم فرض نشده است.</desc>
<defs>
 <style>
 .bg{fill:#f8f7f3}.panel{fill:#fff;stroke:#c9c4ba;stroke-width:2}
 .title{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:29px;font-weight:700;fill:#20282d}
 .subtitle{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:16px;fill:#4d5960}
 .head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:21px;font-weight:700;fill:#29363c}
 .body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:17px;fill:#30383c}
 .small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#5d686e}
 .tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#727b80}
 .room{fill:#edf0ec;stroke:#45544c;stroke-width:2.5}
 .wind{fill:#e4ebee;stroke:#46616b;stroke-width:2.5}
 .iwan{fill:#f4efe5;stroke:#92744f;stroke-width:2.5}
 .yard{fill:#e8eee5;stroke:#708264;stroke-width:2.5}
 .passage{fill:#f8f5ed;stroke:#92744f;stroke-width:2;stroke-dasharray:7 5}
 .air{fill:none;stroke:#2d718b;stroke-width:4;marker-end:url(#blueArrow)}
 .hot{fill:none;stroke:#b2764a;stroke-width:4;marker-end:url(#warmArrow)}
 .note{fill:#f7f0e4;stroke:#d6c7ae;stroke-width:1.4}
 .line{fill:none;stroke:#65716c;stroke-width:1.5;stroke-dasharray:6 5}
 </style>
 <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2d718b"/></marker>
 <marker id="warmArrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b2764a"/></marker>
</defs>
<rect width="1360" height="1000" class="bg"/>
<rect x="28" y="24" width="1304" height="96" rx="10" fill="#293940"/>
<text x="680" y="65" text-anchor="middle" class="title" style="fill:#fff" direction="rtl">ایوان تابستانی و بادگیر — خانهٔ لاری‌ها، یزد</text>
<text x="680" y="95" text-anchor="middle" class="subtitle" style="fill:#e2e8eb" direction="rtl">رابطهٔ فضایی و مسیر تهویهٔ گزارش‌شده؛ بدون حدس دربارهٔ فرم سقف یا پلان دقیق ایوان</text>

<rect x="35" y="145" width="1290" height="500" rx="9" class="panel"/>
<text x="680" y="186" text-anchor="middle" class="head" direction="rtl">۱ ـ دیاگرام رابطهٔ فضایی در بخش تابستان‌نشین</text>
<text x="680" y="214" text-anchor="middle" class="small" direction="rtl">نمای شماتیک از بالا؛ چیدمان فقط رابطهٔ متن را نشان می‌دهد و موقعیت/ابعاد واقعی ترسیم نشده‌اند.</text>

<!-- components -->
<rect x="95" y="300" width="260" height="190" rx="8" class="wind"/>
<text x="225" y="345" text-anchor="middle" class="head" direction="rtl">اتاق بادگیر</text>
<text x="225" y="377" text-anchor="middle" class="body" direction="rtl">بادگیر در پشت ایوان</text>
<text x="225" y="413" text-anchor="middle" class="small" direction="rtl">۶ کانال تهویه گزارش شده</text>
<text x="225" y="447" text-anchor="middle" class="tiny" direction="rtl">آرایش دقیق کانال‌ها ترسیم نشده</text>

<rect x="390" y="350" width="150" height="90" rx="6" class="passage"/>
<text x="465" y="386" text-anchor="middle" class="small" direction="rtl">گذرگاه کوچک</text>
<text x="465" y="412" text-anchor="middle" class="tiny" direction="rtl">میان دو فضا</text>

<rect x="575" y="270" width="350" height="250" rx="8" class="iwan"/>
<text x="750" y="325" text-anchor="middle" class="head" direction="rtl">ایوان تابستانی / تالار</text>
<text x="750" y="360" text-anchor="middle" class="body" direction="rtl">فضای باز به سوی حیاط</text>
<text x="750" y="399" text-anchor="middle" class="small" direction="rtl">پوشش و هندسهٔ دقیق در این سند</text>
<text x="750" y="425" text-anchor="middle" class="small" direction="rtl">برای بازترسیم مستقل اندازه‌گذاری نشده‌اند.</text>
<path d="M925 270V520" stroke="#92744f" stroke-width="4" stroke-dasharray="7 5"/>
<text x="900" y="552" text-anchor="end" class="tiny" direction="rtl">جبههٔ باز رو به حیاط</text>

<rect x="1000" y="300" width="250" height="190" rx="8" class="yard"/>
<text x="1125" y="380" text-anchor="middle" class="head" direction="rtl">حیاط</text>
<text x="1125" y="414" text-anchor="middle" class="small" direction="rtl">مسیر تخلیهٔ هوای گرم</text>

<!-- airflow -->
<path d="M225 290V245H225V260" class="air"/>
<text x="250" y="253" class="small" direction="rtl">گرفتن هوا از بالا</text>
<path d="M355 395H385" class="air"/>
<path d="M540 395H570" class="air"/>
<path d="M750 520V580H1120V495" class="hot"/>
<text x="760" y="609" class="small" direction="rtl">هوای گرم از ایوان باز به حیاط تخلیه می‌شود</text>

<rect x="35" y="675" width="620" height="220" rx="9" class="panel"/>
<text x="345" y="715" text-anchor="middle" class="head" direction="rtl">۲ ـ داده‌های قطعی کیس</text>
<text x="75" y="758" class="body" direction="rtl">• بادگیر پشت ایوان و در جبههٔ جنوبی بخش تابستان‌نشین.</text>
<text x="75" y="797" class="body" direction="rtl">• گذرگاهی کوچک میان اتاق بادگیر و ایوان.</text>
<text x="75" y="836" class="body" direction="rtl">• ۶ کانال تهویه در بخش داخلی بادگیر.</text>
<text x="75" y="875" class="small" direction="rtl">• زیر بادگیر قنات/کریز گزارش نشده است.</text>

<rect x="680" y="675" width="645" height="220" rx="9" class="note"/>
<text x="1002" y="715" text-anchor="middle" class="head" direction="rtl">۳ ـ حدود اعتبار این بازترسیم</text>
<text x="720" y="758" class="body" direction="rtl">• پلان و مقطع شکل ۶، رابطهٔ بادگیر، ایوان و حیاط را نشان می‌دهد.</text>
<text x="720" y="797" class="body" direction="rtl">• شکل دقیق سقف، دهانه، ابعاد و ستون‌بندی ایوان در این شیت حدس زده نشده‌اند.</text>
<text x="720" y="836" class="body" direction="rtl">• دیاگرام، موقعیت واقعی در پلان را بازسازی نمی‌کند؛ فقط روابط گزارش‌شده را نمایش می‌دهد.</text>
<text x="720" y="875" class="small" direction="rtl">• برای پلان اندازه‌دار، اصل نقشهٔ میراث فرهنگی DN 272–273 لازم است.</text>

<text x="680" y="945" text-anchor="middle" class="tiny">Armanfar &amp; Akdeniz (2024), Mimarlık ve Yaşam 9(1), pp.99, 105–107, Figures 3, 6–8. DOI: 10.26835/my.1264810.</text>
</svg>