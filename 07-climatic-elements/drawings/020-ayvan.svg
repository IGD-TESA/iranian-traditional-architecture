<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">ایوان طاق‌دار ایرانی؛ پلان، نمای روبه‌حیاط، مقطع طولی و آکسونومتری</title>
<desc id="desc">دیاگرام کالبدی یک ایوان مستطیل‌شکل با سه جبههٔ بسته، یک جبههٔ کاملاً باز رو به حیاط، و پوشش طاقی نیم‌استوانه‌ای. چهار تصویر شامل پلان، نمای دهانه، مقطع طولی و آکسونومتری کالبد هستند. این یک گونهٔ مبنای طاق‌دار است، نه الگوی یگانهٔ همهٔ ایوان‌های ایران.</desc>
<defs>
  <pattern id="wall" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#b4b8bd" stroke-width="1"/></pattern>
  <pattern id="cut" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#858b91" stroke-width="1.1"/></pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#285b78"/></marker>
  <style>
    .panel{fill:#fff;stroke:#c7cbd0;stroke-width:1.5}
    .outline{fill:none;stroke:#20252b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .thin{fill:none;stroke:#20252b;stroke-width:1.7}
    .axis{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:7 5}
    .blue{fill:none;stroke:#285b78;stroke-width:2.4;marker-end:url(#arrow)}
    .head{font:600 22px Vazirmatn, 'Noto Sans Arabic', sans-serif;fill:#20252b}
    .label{font:16px Vazirmatn, 'Noto Sans Arabic', sans-serif;fill:#20252b}
    .small{font:13px Vazirmatn, 'Noto Sans Arabic', sans-serif;fill:#4b5563}
    .white{fill:#fff;stroke:#20252b;stroke-width:1.2}
  </style>
</defs>
<rect width="1200" height="850" fill="#fff"/>
<text x="600" y="42" text-anchor="middle" direction="rtl" class="head">ایوان طاق‌دار؛ سه جبههٔ بسته و یک جبههٔ باز رو به حیاط</text>
<text x="600" y="70" text-anchor="middle" direction="rtl" class="small">گونهٔ کالبدی مبنا برای مطالعه؛ پوشش طاقی در این نمونه انتخاب شده و همهٔ ایوان‌ها الزاماً همین پوشش را ندارند.</text>

<!-- PLAN -->
<rect class="panel" x="35" y="95" width="550" height="330" rx="8"/>
<text x="310" y="128" text-anchor="middle" direction="rtl" class="head">۱ ـ پلان از بالا</text>
<!-- U-shaped three-side enclosure -->
<rect x="105" y="165" width="410" height="30" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="105" y="165" width="30" height="205" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="485" y="165" width="30" height="205" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="135" y="195" width="350" height="175" fill="#f7f8f8" stroke="#aeb4ba" stroke-width="1.3"/>
<line x1="135" y1="195" x2="485" y2="195" class="axis"/>
<text x="310" y="255" text-anchor="middle" direction="rtl" class="label">فضای سرپوشیدهٔ ایوان</text>
<text x="310" y="280" text-anchor="middle" direction="rtl" class="small">عمق فضا از دهانه تا دیوار انتهایی</text>
<path d="M310 355 L310 405" class="blue"/>
<text x="310" y="398" text-anchor="middle" direction="rtl" class="label">دهانهٔ باز به حیاط</text>
<text x="155" y="180" text-anchor="middle" direction="rtl" class="small">دیوار جانبی</text>
<text x="465" y="180" text-anchor="middle" direction="rtl" class="small">دیوار جانبی</text>
<text x="310" y="158" text-anchor="middle" direction="rtl" class="small">دیوار انتهایی</text>
<text x="310" y="418" text-anchor="middle" direction="rtl" class="small">در این گونه، جبههٔ چهارم دیوار ندارد.</text>

<!-- FRONT ELEVATION -->
<rect class="panel" x="615" y="95" width="550" height="330" rx="8"/>
<text x="890" y="128" text-anchor="middle" direction="rtl" class="head">۲ ـ نمای روبه‌حیاط (دهانهٔ ایوان)</text>
<line x1="690" y1="370" x2="1090" y2="370" class="outline"/>
<!-- side piers and arch -->
<rect x="735" y="205" width="55" height="165" fill="url(#cut)" stroke="#20252b" stroke-width="2.3"/>
<rect x="990" y="205" width="55" height="165" fill="url(#cut)" stroke="#20252b" stroke-width="2.3"/>
<path d="M790 370 L790 245 Q890 95 990 245 L990 370" fill="#e8eef1" stroke="#20252b" stroke-width="3"/>
<path d="M815 370 L815 250 Q890 125 965 250 L965 370" fill="#fff" stroke="#65717b" stroke-width="1.8"/>
<path d="M735 205 L735 188 Q890 70 1045 188 L1045 205" class="thin"/>
<text x="890" y="342" text-anchor="middle" direction="rtl" class="label">فضای بازِ دهانه؛ نه یک پنجرهٔ دیواری</text>
<path d="M890 220 L890 157" class="axis"/>
<text x="890" y="150" text-anchor="middle" direction="rtl" class="small">قوسِ دهانه / پیشانی طاق</text>
<text x="760" y="392" text-anchor="middle" direction="rtl" class="small">جرز یا پایهٔ کناری</text>
<text x="1018" y="392" text-anchor="middle" direction="rtl" class="small">جرز یا پایهٔ کناری</text>
<text x="890" y="418" text-anchor="middle" direction="rtl" class="small">تزئینات و قاب پیرامونی متغیرند و جزء تعریف پایه نیستند.</text>

<!-- LONGITUDINAL SECTION -->
<rect class="panel" x="35" y="445" width="550" height="330" rx="8"/>
<text x="310" y="478" text-anchor="middle" direction="rtl" class="head">۳ ـ مقطع طولی از محور عمق</text>
<!-- floor -->
<line x1="105" y1="710" x2="515" y2="710" class="outline"/>
<!-- rear wall -->
<rect x="105" y="555" width="34" height="155" fill="url(#cut)" stroke="#20252b" stroke-width="2"/>
<!-- side cut walls schematically -->
<path d="M139 555 Q320 365 480 555" fill="#e8eef1" stroke="#20252b" stroke-width="3"/>
<path d="M139 555 L139 710 M480 555 L480 710" class="outline"/>
<!-- front opening line -->
<path d="M480 555 Q500 578 500 610" class="thin"/>
<line x1="480" y1="555" x2="480" y2="710" class="axis"/>
<text x="310" y="640" text-anchor="middle" direction="rtl" class="label">فضای داخلیِ سرپوشیده</text>
<path d="M465 585 L430 550" class="blue"/>
<text x="430" y="535" text-anchor="middle" direction="rtl" class="small">پوشش طاقی در امتداد عمق</text>
<path d="M120 625 L175 625" class="blue"/>
<text x="195" y="620" text-anchor="start" direction="rtl" class="small">دیوار انتهایی</text>
<path d="M490 660 L535 660" class="blue"/>
<text x="545" y="653" text-anchor="end" direction="rtl" class="small">دهانهٔ باز به حیاط</text>
<text x="310" y="745" text-anchor="middle" direction="rtl" class="small">مقطع، عمق واقعی فضا و اتصال پوشش به جرزها را آشکار می‌کند.</text>

<!-- AXONOMETRIC -->
<rect class="panel" x="615" y="445" width="550" height="330" rx="8"/>
<text x="890" y="478" text-anchor="middle" direction="rtl" class="head">۴ ـ آکسونومتری کالبد ایوان</text>
<!-- floor parallelogram -->
<polygon points="720,660 895,725 1090,635 915,570" fill="#f4f4f2" stroke="#20252b" stroke-width="2"/>
<!-- left wall -->
<polygon points="720,660 915,570 915,435 720,525" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<!-- rear wall -->
<polygon points="915,570 1090,635 1090,500 915,435" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<!-- right wall -->
<polygon points="895,725 1090,635 1090,500 895,590" fill="#e4e7e9" fill-opacity=".72" stroke="#20252b" stroke-width="2"/>
<!-- vaulted roof surface: front to back, with open mouth visible -->
<path d="M720 525 Q807 405 895 590 L1090 500 Q1002 315 915 435 Z" fill="#dbe6eb" fill-opacity=".92" stroke="#20252b" stroke-width="2.4"/>
<!-- opening arch at front face -->
<path d="M720 660 L720 525 Q807 405 895 590 L895 725" fill="none" stroke="#285b78" stroke-width="3"/>
<!-- floor line inside -->
<line x1="755" y1="646" x2="890" y2="695" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="795" y="505" text-anchor="middle" direction="rtl" class="small">پوستهٔ طاق</text>
<text x="1010" y="475" text-anchor="middle" direction="rtl" class="small">دیوار انتهایی</text>
<text x="1020" y="690" text-anchor="middle" direction="rtl" class="small">دیوار جانبی</text>
<text x="800" y="735" text-anchor="middle" direction="rtl" class="small">دهانهٔ کاملاً باز</text>

<line x1="35" y1="795" x2="1165" y2="795" stroke="#c7cbd0" stroke-width="1"/>
<text x="600" y="822" text-anchor="middle" direction="rtl" class="small">این صفحه، یک گونهٔ طاق‌دارِ سه‌طرف‌بسته را توضیح می‌دهد؛ ایوان‌های تخت‌پوش، ستون‌دار یا منطقه‌ای باید به‌صورت گونه‌های جداگانه مستند شوند.</text>
</svg>