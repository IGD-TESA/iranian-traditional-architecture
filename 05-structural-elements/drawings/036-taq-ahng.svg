<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1060" viewBox="0 0 1420 1060" role="img" aria-labelledby="t d">
<title id="t">طاق آهنگ‌های مایل میان قوس‌های دیافراگمی؛ خانهٔ سیستانی، ارگ بم، اتاق ۱۱</title>
<desc id="d">بازترسیم تحلیلی بر اساس گزارش فنی Wendland 2007. محدودهٔ پوشش حدود ۵٫۳۰ متر در امتداد طولی و دهانهٔ قوس ۳٫۵۷ متر است. سامانه شامل چهار قوس عرضی نوک‌تیز با چهار قطعهٔ دایره‌ای در هر قوس است؛ دو قوس انتهایی و دو قوس میانی. قوس‌های طولی تکیه‌گاهی در دو دیوار طولی نیز وجود دارند. فاصلهٔ قوس‌های میانی و ارتفاع/شعاع قوس‌ها در متن اندازه‌گذاری نشده و در این شیت فرض نشده‌اند. این یک بازسازی پژوهشی بر پایهٔ مدارک و قیاس است، نه برداشت قطعی بقایای اتاق ۱۱.</desc>
<defs>
 <style>
 .bg{fill:#f8f7f3}.panel{fill:#fff;stroke:#c9c4ba;stroke-width:2}.title{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:28px;font-weight:700;fill:#20282d}.subtitle{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:16px;fill:#4d5960}.head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:21px;font-weight:700;fill:#29363c}.body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:16px;fill:#30383c}.small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:13px;fill:#5d686e}.tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:11px;fill:#727b80}.wall{stroke:#3b474c;stroke-width:4;fill:#eee9df}.vault{stroke:#57717a;stroke-width:5;fill:none}.arch{stroke:#8a6447;stroke-width:5;fill:none}.guide{stroke:#9a8e7f;stroke-width:1.5;stroke-dasharray:7 6;fill:none}.dim{stroke:#35424a;stroke-width:1.5;fill:none}.note{fill:#f7f0e4;stroke:#d6c7ae;stroke-width:1.3}
 </style>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#35424a"/></marker>
</defs>
<rect width="1420" height="1060" class="bg"/>
<rect x="28" y="22" width="1364" height="94" rx="10" fill="#293940"/>
<text x="710" y="62" text-anchor="middle" class="title" style="fill:#fff" direction="rtl">طاق آهنگ‌های مایل — خانهٔ سیستانی، ارگ بم، اتاق ۱۱</text>
<text x="710" y="93" text-anchor="middle" class="subtitle" style="fill:#e2e8eb" direction="rtl">چهار قوس عرضی دیافراگمی و قوس‌های طولی تکیه‌گاهی؛ بازسازی پژوهشی بر اساس Wendland (2007)</text>

<!-- DIMENSIONAL FOOTPRINT -->
<rect x="35" y="140" width="650" height="390" rx="9" class="panel"/>
<text x="360" y="180" text-anchor="middle" class="head" direction="rtl">۱ ـ پاکت ابعادیِ پوشش</text>
<text x="360" y="208" text-anchor="middle" class="small" direction="rtl">ابعاد صریح گزارش؛ مکان قوس‌های میانی اندازه‌گذاری نشده است.</text>
<rect x="105" y="260" width="500" height="337" class="wall"/>
<rect x="118" y="273" width="474" height="311" fill="#fff" stroke="#66747a" stroke-width="1.5"/>
<text x="355" y="418" text-anchor="middle" class="body" direction="rtl">محدودهٔ پوشش</text>
<text x="355" y="446" text-anchor="middle" class="small" direction="rtl">بدون جانمایی قوس‌های میانی</text>
<!-- longitudinal dimension 5.30 -->
<path d="M105 244V229 M605 244V229 M105 235H605" class="dim"/>
<text x="355" y="226" text-anchor="middle" class="body">حدود ۵٫۳۰ متر — امتداد طولی</text>
<!-- span 3.57 -->
<path d="M623 260H642 M623 597H642 M634 260V597" class="dim"/>
<text x="657" y="430" class="small" transform="rotate(90 657 430)">۳٫۵۷ متر — دهانهٔ قوس</text>
<text x="355" y="625" text-anchor="middle" class="tiny" direction="rtl">این مستطیل فقط پاکت ابعادی پوشش است؛ پلان کامل اتاق ۱۱ نیست.</text>
<text x="355" y="649" text-anchor="middle" class="tiny" direction="rtl">ابعاد از گزارش؛ ترسیم در این صفحه نسبتی و تحلیلی است.</text>

<!-- CROSS SECTION -->
<rect x="715" y="140" width="670" height="390" rx="9" class="panel"/>
<text x="1050" y="180" text-anchor="middle" class="head" direction="rtl">۲ ـ مقطع عرضیِ مفهومی قوس</text>
<text x="1050" y="208" text-anchor="middle" class="small" direction="rtl">قوس نوک‌تیز؛ چهار قطعهٔ دایره‌ای در هر قوس، ارتفاع نامعلوم</text>
<line x1="835" y1="455" x2="1265" y2="455" stroke="#30383c" stroke-width="5"/>
<path d="M835 455 C860 375 925 305 1050 260 C1175 305 1240 375 1265 455" class="guide"/>
<path d="M835 455 C870 392 925 330 1040 266" class="arch"/>
<path d="M1040 266 Q1048 260 1050 260" class="arch"/>
<path d="M1050 260 Q1054 260 1060 266" class="arch"/>
<path d="M1060 266 C1175 330 1230 392 1265 455" class="arch"/>
<rect x="805" y="455" width="60" height="50" class="wall"/>
<rect x="1235" y="455" width="60" height="50" class="wall"/>
<path d="M1050 255V235" class="dim" marker-end="url(#arr)"/>
<text x="1075" y="239" class="small" direction="rtl">رأس نوک‌تیز</text>
<path d="M835 475V490 M1265 475V490 M835 485H1265" class="dim"/>
<text x="1050" y="515" text-anchor="middle" class="body">دهانه: ۳٫۵۷ متر</text>
<text x="1050" y="548" text-anchor="middle" class="tiny" direction="rtl">منحنی و تقسیم‌بندی قوس در این شیت شماتیک است؛ شعاع‌ها و خیز از متن استخراج نشده‌اند.</text>

<!-- SYSTEM DIAGRAM -->
<rect x="35" y="570" width="1350" height="335" rx="9" class="panel"/>
<text x="710" y="610" text-anchor="middle" class="head" direction="rtl">۳ ـ سازمان سازه‌ای پوشش و تکیه‌گاه‌ها</text>
<text x="710" y="638" text-anchor="middle" class="small" direction="rtl">چهار قوس عرضی؛ دو انتهایی و دو میانی. فاصلهٔ دو قوس میانی نامعلوم است.</text>
<!-- walls -->
<path d="M170 820L170 700 M1160 820L1160 700" stroke="#3b474c" stroke-width="14"/>
<!-- longitudinal formeret arches along sides -->
<path d="M170 700 Q665 645 1160 700" class="vault"/>
<path d="M170 820 Q665 765 1160 820" class="vault"/>
<!-- transverse arches conceptual at ends + two interior positions -->
<path d="M170 700 Q230 625 290 700 M170 820 Q230 745 290 820" class="arch"/>
<path d="M470 685 Q530 610 590 685 M470 805 Q530 730 590 805" class="guide"/>
<path d="M750 685 Q810 610 870 685 M750 805 Q810 730 870 805" class="guide"/>
<path d="M1040 700 Q1100 625 1160 700 M1040 820 Q1100 745 1160 820" class="arch"/>
<text x="230" y="680" text-anchor="middle" class="small" direction="rtl">قوس انتهایی</text>
<text x="530" y="665" text-anchor="middle" class="small" direction="rtl">قوس میانی ۱</text>
<text x="810" y="665" text-anchor="middle" class="small" direction="rtl">قوس میانی ۲</text>
<text x="1100" y="680" text-anchor="middle" class="small" direction="rtl">قوس انتهایی</text>
<text x="665" y="866" text-anchor="middle" class="small" direction="rtl">قوس‌های طولی تکیه‌گاهی (Formeret) در امتداد دو دیوار طولی شرقی و غربی</text>

<rect x="35" y="930" width="1350" height="85" rx="8" class="note"/>
<text x="710" y="964" text-anchor="middle" class="body" direction="rtl">رانش پوشش در محل springing قوس‌های عرضی متمرکز می‌شود و به دو دیوار طولی شرقی و غربی منتقل می‌گردد.</text>
<text x="710" y="992" text-anchor="middle" class="small" direction="rtl">منبع: Wendland (2007)، بخش Room 11، pp. 6–7، Figures 11–13؛ DOI: 10.18419/OPUS-47.</text>
<text x="710" y="1040" text-anchor="middle" class="tiny" direction="rtl">این هندسه از مستندات و قیاس نمونه‌های مشابه بازسازی پژوهشی شده است؛ بقایای اتاق ۱۱ به‌تنهایی برای اندازه‌برداری کامل کافی نبودند.</text>
</svg>