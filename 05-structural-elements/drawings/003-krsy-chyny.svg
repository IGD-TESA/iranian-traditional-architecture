<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="ttl dsc">
<title id="ttl">کرسی‌چینی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی کرسی‌چینی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#9ca3af" stroke-width=".8"/></pattern></defs><rect width="640" height="430" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">کرسی‌چینی</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<line x1="75" y1="330" x2="565" y2="330" stroke="#252525" stroke-width="3" /><rect x="145" y="135" width="350" height="175" rx="0" fill="url(#hatch)" stroke="#252525" stroke-width="2"/><rect x="120" y="310" width="400" height="40" rx="0" fill="#d6d3d1" stroke="#252525" stroke-width="2"/>
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
</svg>