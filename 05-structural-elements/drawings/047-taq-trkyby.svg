<title id="ttl">طاق ترکیبی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی طاق ترکیبی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
