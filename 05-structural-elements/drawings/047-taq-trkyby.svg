<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<rect x="130" y="300" width="380" height="50" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="1.4"/><path d="M170 300 L320 65 L470 300" fill="#d9e7ee" stroke="#252525" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M130 190 Q220 20 320 190 Q420 20 510 190" fill="none" stroke="#252525" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
