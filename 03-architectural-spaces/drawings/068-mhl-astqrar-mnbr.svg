<title id="ttl">محل استقرار منبر — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی محل استقرار منبر در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
