<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">حیاط</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<rect x="115" y="85" width="410" height="270" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="3"/><rect x="165" y="135" width="310" height="170" rx="0" fill="#dcebdc" stroke="#252525" stroke-width="1.5"/><circle cx="320" cy="220" r="24" fill="#c8e1ed" stroke="#252525" stroke-width="1.5"/>
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
