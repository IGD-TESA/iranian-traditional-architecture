<title id="ttl">هشتی — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی هشتی در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
