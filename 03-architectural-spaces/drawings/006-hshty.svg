<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">هشتی ورودی خانهٔ لاری‌ها، یزد؛ دیاگرام جایگاه و تقسیم مسیر</title>
<desc id="desc">دیاگرام رابطهٔ فضایی هشتی ورودی اصلی خانهٔ لاری‌ها میان حیاط بیرونی و حیاط اندرونی بر پایهٔ شکل ۳ مقالهٔ Armanfar و Akdeniz سال ۲۰۲۴. منبع می‌گوید هشتی میان دو حیاط و در فاصلهٔ برابر از آن‌ها قرار دارد. هندسه و ابعاد دقیق خود هشتی در متن و تصویر در دسترس اندازه‌گذاری نشده‌اند؛ بنابراین شکل اتاق به‌صورت نماد رابطه‌ای و بدون تعیین پلان، اندازه یا تعداد اضلاع نشان داده شده است. تعریف عمومی هشتی در پاورقی مقاله آن را معمولاً اتاقی هشت‌ضلعی معرفی می‌کند، اما این تعریف به‌تنهایی اثبات نمی‌کند هشتی خانهٔ لاری‌ها نیز دقیقاً هشت‌ضلعی است.</desc>
<defs>
 <style>
 .bg{fill:#f8f7f3}.panel{fill:#fff;stroke:#c9c4ba;stroke-width:2}
 .title{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:29px;font-weight:700;fill:#20282d}
 .subtitle{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:16px;fill:#4d5960}
 .head{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:22px;font-weight:700;fill:#29363c}
 .body{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:18px;fill:#30383c}
 .small{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:14px;fill:#5d686e}
 .tiny{font-family:Vazirmatn,'Noto Sans Arabic',sans-serif;font-size:12px;fill:#727b80}
 .court{fill:#e8eeeb;stroke:#667c73;stroke-width:2.5}
 .vest{fill:#f6f0e5;stroke:#9b7952;stroke-width:2.5;stroke-dasharray:9 6}
 .path{stroke:#49616b;stroke-width:4;fill:none;stroke-dasharray:8 7}
 .uncertain{fill:#f8f5ee;stroke:#b29a78;stroke-width:1.5;stroke-dasharray:6 5}
 </style>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#49616b"/></marker>
</defs>
<rect width="1280" height="860" class="bg"/>
<rect x="28" y="24" width="1224" height="96" rx="10" fill="#293940"/>
<text x="640" y="64" text-anchor="middle" direction="rtl" class="title" style="fill:#fff">هشتی ورودی خانهٔ لاری‌ها — یزد</text>
<text x="640" y="94" text-anchor="middle" direction="rtl" class="subtitle" style="fill:#e2e8eb">موقعیت میان حیاط بیرونی و اندرونی و نقش تقسیم مسیر؛ دیاگرام رابطه‌ای، نه پلان بازترسیم‌شده</text>

<rect x="35" y="145" width="1210" height="510" rx="9" class="panel"/>
<text x="640" y="187" text-anchor="middle" direction="rtl" class="head">۱ ـ جایگاه هشتی در توالی ورود و ارتباط دو حیاط</text>
<text x="640" y="216" text-anchor="middle" direction="rtl" class="small">رابطهٔ توپولوژیک بر اساس متن مقاله؛ جانمایی تصویری و جهت‌ها قراردادی‌اند.</text>

<!-- approach -->
<rect x="500" y="265" width="280" height="70" rx="7" fill="#eef1f2" stroke="#85939a" stroke-width="2"/>
<text x="640" y="308" text-anchor="middle" class="body" direction="rtl">ورودی اصلی خانه</text>
<path d="M640 335V386" class="path" marker-end="url(#arr)"/>

<!-- hashti, neutral geometric node -->
<rect x="425" y="390" width="430" height="118" rx="18" class="vest"/>
<text x="640" y="434" text-anchor="middle" class="head" direction="rtl">هشتی / فضای واسط ورودی</text>
<text x="640" y="466" text-anchor="middle" class="small" direction="rtl">مکان مستند؛ پلان و اندازهٔ دقیق در منبع تعیین نشده</text>

<!-- split to courtyards -->
<path d="M520 508L335 550" class="path" marker-end="url(#arr)"/>
<path d="M760 508L945 550" class="path" marker-end="url(#arr)"/>

<rect x="95" y="548" width="390" height="78" rx="8" class="court"/>
<text x="290" y="594" text-anchor="middle" class="head" direction="rtl">حیاط بیرونی (بیرونی)</text>
<rect x="795" y="548" width="390" height="78" rx="8" class="court"/>
<text x="990" y="594" text-anchor="middle" class="head" direction="rtl">حیاط اندرونی (اندرونی)</text>

<!-- equal distance annotation -->
<path d="M290 535H990" stroke="#9a8060" stroke-width="1.6" stroke-dasharray="5 6"/>
<rect x="490" y="516" width="300" height="34" rx="5" fill="#fff"/>
<text x="640" y="539" text-anchor="middle" class="small" direction="rtl">هشتی در فاصلهٔ برابر از دو حیاط</text>

<rect x="35" y="680" width="1210" height="135" rx="9" class="uncertain"/>
<text x="640" y="718" text-anchor="middle" class="head" direction="rtl">حدود اعتبار و نکتهٔ اصطلاح‌شناختی</text>
<text x="640" y="754" text-anchor="middle" class="body" direction="rtl">در پاورقی مقاله، هشتی به‌طور عمومی اتاقی معمولاً هشت‌ضلعی تعریف شده که مسیر ورود را به دو یا چند جهت تقسیم می‌کند.</text>
<text x="640" y="783" text-anchor="middle" class="small" direction="rtl">اما هندسه و ابعاد هشتیِ خانهٔ لاری‌ها در شکل ۳ اندازه‌گذاری نشده؛ این دیاگرام هشت‌ضلعی‌بودنِ این نمونه را ادعا نمی‌کند.</text>
<text x="640" y="838" text-anchor="middle" class="tiny">Armanfar &amp; Akdeniz (2024), Mimarlık ve Yaşam 9(1), 87–113, printed p.99, Figure 3 and footnote 1 · DOI: 10.26835/my.1264810</text>
</svg>