<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">ایوان طاق‌دار ایرانی؛ پلان، نمای دهانه، مقطع طولی و آکسونومتری</title>
<desc id="desc">گونهٔ طاق‌دار ایوان: فضای مستطیل و سرپوشیده با دیوار انتهایی و دو دیوار جانبی، و یک جبههٔ باز رو به حیاط. چهار تصویر مستقل در یک صفحه: پلان، نمای روبه‌حیاط، مقطع طولی از محور عمق و آکسونومتری کالبد. این گونه نمایندهٔ همهٔ انواع ایوان نیست.</desc>
<defs>
 <pattern id="wall" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10 L10 0" stroke="#9da4aa" stroke-width="1"/></pattern>
 <pattern id="cut" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#858b91" stroke-width="1.1"/></pattern>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#285b78"/></marker>
 <style>
 .panel{fill:#fff;stroke:#c7cbd0;stroke-width:1.5}
 .outline{fill:none;stroke:#20252b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
 .thin{fill:none;stroke:#20252b;stroke-width:1.6}
 .dash{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 5}
 .blue{fill:none;stroke:#285b78;stroke-width:2;marker-end:url(#arr)}
 .head{font:600 21px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#20252b}
 .label{font:15px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#20252b}
 .small{font:12px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#58616b}
 </style>
</defs>
<rect width="1200" height="850" fill="#fff"/>
<text x="600" y="40" text-anchor="middle" direction="rtl" class="head">ایوان طاق‌دار؛ سه جبههٔ بسته و یک جبههٔ باز رو به حیاط</text>
<text x="600" y="67" text-anchor="middle" direction="rtl" class="small">گونهٔ کالبدی مبنا؛ پوشش طاقی و دهانهٔ قوس‌دار در این نمونه انتخاب شده‌اند، نه به‌عنوان شکل یگانهٔ همهٔ ایوان‌ها.</text>

<!-- PLAN -->
<rect class="panel" x="30" y="90" width="555" height="330" rx="8"/>
<text x="307" y="123" text-anchor="middle" direction="rtl" class="head">۱ ـ پلان از بالا</text>
<rect x="100" y="160" width="415" height="32" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="100" y="160" width="32" height="210" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="483" y="160" width="32" height="210" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="132" y="192" width="351" height="178" fill="#f8f9fa" stroke="#b7bdc3" stroke-width="1.2"/>
<text x="307" y="260" text-anchor="middle" direction="rtl" class="label">فضای سرپوشیدهٔ ایوان</text>
<text x="307" y="284" text-anchor="middle" direction="rtl" class="small">عمق از دهانه تا دیوار انتهایی</text>
<text x="307" y="151" text-anchor="middle" direction="rtl" class="small">دیوار انتهایی</text>
<text x="145" y="350" text-anchor="start" direction="rtl" class="small">دیوار جانبی</text>
<text x="470" y="350" text-anchor="end" direction="rtl" class="small">دیوار جانبی</text>
<path d="M307 372 V400" class="blue"/>
<text x="307" y="397" text-anchor="middle" direction="rtl" class="small">دهانهٔ باز؛ بدون دیوارِ جلویی</text>
<text x="307" y="414" text-anchor="middle" direction="rtl" class="small">خط چین: محور مقطع طولی</text>
<line x1="307" y1="192" x2="307" y2="370" class="dash"/>

<!-- FRONT ELEVATION -->
<rect class="panel" x="615" y="90" width="555" height="330" rx="8"/>
<text x="892" y="123" text-anchor="middle" direction="rtl" class="head">۲ ـ نمای روبه‌حیاط؛ دهانهٔ ایوان</text>
<line x1="690" y1="365" x2="1095" y2="365" class="outline"/>
<rect x="735" y="220" width="60" height="145" fill="url(#cut)" stroke="#20252b" stroke-width="2"/>
<rect x="990" y="220" width="60" height="145" fill="url(#cut)" stroke="#20252b" stroke-width="2"/>
<path d="M795 365 V245 Q892 95 990 245 V365" fill="#e6edf1" stroke="#20252b" stroke-width="3"/>
<path d="M818 365 V250 Q892 130 967 250 V365" fill="#fff" stroke="#65717b" stroke-width="1.8"/>
<path d="M735 220 V205 Q892 80 1050 205 V220" class="thin"/>
<text x="892" y="342" text-anchor="middle" direction="rtl" class="label">دهانهٔ باز و عمقِ فضای پشت آن</text>
<path d="M892 210 V155" class="dash"/>
<text x="892" y="148" text-anchor="middle" direction="rtl" class="small">قوسِ پیشانیِ دهانه در این گونه</text>
<text x="765" y="391" text-anchor="middle" direction="rtl" class="small">جرز کناری</text>
<text x="1020" y="391" text-anchor="middle" direction="rtl" class="small">جرز کناری</text>
<text x="892" y="412" text-anchor="middle" direction="rtl" class="small">قاب و آرایهٔ پیرامون دهانه متغیر است؛ خودِ ایوان فضای پشت دهانه است.</text>

<!-- LONGITUDINAL SECTION -->
<rect class="panel" x="30" y="440" width="555" height="335" rx="8"/>
<text x="307" y="473" text-anchor="middle" direction="rtl" class="head">۳ ـ مقطع طولی از محور عمق</text>
<!-- floor and rear wall -->
<line x1="100" y1="710" x2="520" y2="710" class="outline"/>
<rect x="100" y="545" width="34" height="165" fill="url(#cut)" stroke="#20252b" stroke-width="2"/>
<!-- barrel vault as longitudinal extrusion: straight longitudinal crown, not a dome -->
<path d="M134 545 H485 V570 H134 Z" fill="#e6edf1" stroke="#20252b" stroke-width="2.5"/>
<line x1="134" y1="570" x2="485" y2="570" class="thin"/>
<line x1="485" y1="545" x2="485" y2="710" class="dash"/>
<path d="M485 570 L485 710" class="dash"/>
<text x="305" y="630" text-anchor="middle" direction="rtl" class="label">حجمِ سرپوشیده با عمق قابل‌توجه</text>
<text x="305" y="653" text-anchor="middle" direction="rtl" class="small">در مقطع طولی، امتداد طاق در راستای عمق دیده می‌شود.</text>
<path d="M200 520 L200 542" class="blue"/>
<text x="200" y="510" text-anchor="middle" direction="rtl" class="small">پوستهٔ طاق در امتداد طول</text>
<path d="M490 615 H545" class="blue"/>
<text x="535" y="600" text-anchor="end" direction="rtl" class="small">دهانهٔ باز به حیاط</text>
<text x="118" y="735" text-anchor="start" direction="rtl" class="small">دیوار انتهایی</text>
<text x="307" y="758" text-anchor="middle" direction="rtl" class="small">این مقطع، عمق فضا را نشان می‌دهد؛ قوسِ دهانه در نمای روبه‌حیاط دیده می‌شود.</text>

<!-- AXONOMETRIC -->
<rect class="panel" x="615" y="440" width="555" height="335" rx="8"/>
<text x="892" y="473" text-anchor="middle" direction="rtl" class="head">۴ ـ آکسونومتری؛ حجم سه‌بعدی ایوان</text>
<!-- ground floor parallelogram -->
<polygon points="710,650 885,720 1090,625 915,555" fill="#f5f5f3" stroke="#20252b" stroke-width="2"/>
<!-- side walls and rear wall -->
<polygon points="710,650 915,555 915,430 710,525" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<polygon points="915,555 1090,625 1090,500 915,430" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<polygon points="885,720 1090,625 1090,500 885,595" fill="#e4e8ea" fill-opacity=".92" stroke="#20252b" stroke-width="2"/>
<!-- barrel roof skin extending from mouth to back -->
<path d="M710 525 Q797 405 885 595 L1090 500 Q1002 310 915 430 Z" fill="#dbe6eb" fill-opacity=".88" stroke="#20252b" stroke-width="2.5"/>
<!-- floor line inside and open front edge -->
<line x1="742" y1="641" x2="878" y2="695" class="dash"/>
<path d="M710 650 Q797 530 885 720" class="dash"/>
<text x="790" y="505" text-anchor="middle" direction="rtl" class="small">پوشش طاقی</text>
<text x="1015" y="468" text-anchor="middle" direction="rtl" class="small">دیوار انتهایی</text>
<text x="1030" y="690" text-anchor="middle" direction="rtl" class="small">دیوار جانبی</text>
<text x="795" y="742" text-anchor="middle" direction="rtl" class="small">جبههٔ باز؛ بدون دیوار جلویی</text>

<line x1="35" y1="795" x2="1165" y2="795" stroke="#c7cbd0"/>
<text x="600" y="820" text-anchor="middle" direction="rtl" class="small">گونهٔ طاق‌دارِ سه‌طرف‌بسته؛ برای ایوان‌های تخت‌پوش، ستون‌دار یا منطقه‌ای، ترسیم گونهٔ مستقل لازم است.</text>
</svg>