<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">ایوان تخت‌پوش دو ستون‌دار؛ نمونهٔ موردی خانهٔ منطق‌نژاد شیراز</title>
<desc id="desc">بازترسیم تحلیلی از ایوان تخت‌پوش با دو ستون که به حیاط مرکزی باز می‌شود و با تالار در پشت خود ارتباط دارد، براساس توصیف و تصاویر مقالهٔ Shaeri, Yaghoubi and Habibi, Buildings 8(6), 81, 2018. ابعاد و اندازه‌های دقیق از مقاله استخراج نشده‌اند؛ ترسیم مقیاس‌دار نیست.</desc>
<defs>
 <pattern id="wall" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9 L9 0" stroke="#9ca3af" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#285b78"/></marker>
 <style>
 .panel{fill:#fff;stroke:#c7cbd0;stroke-width:1.5}
 .line{fill:none;stroke:#20252b;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
 .thin{fill:none;stroke:#20252b;stroke-width:1.4}
 .dashed{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:6 5}
 .arrow{fill:none;stroke:#285b78;stroke-width:2;marker-end:url(#arr)}
 .head{font:600 21px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#20252b}
 .label{font:15px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#20252b}
 .small{font:12px Vazirmatn,'Noto Sans Arabic',sans-serif;fill:#58616b}
 </style>
</defs>
<rect width="1200" height="850" fill="#fff"/>
<text x="600" y="40" text-anchor="middle" direction="rtl" class="head">ایوان تخت‌پوشِ دو ستون‌دار؛ نمونهٔ خانهٔ منطق‌نژاد شیراز</text>
<text x="600" y="68" text-anchor="middle" direction="rtl" class="small">بازترسیم تحلیلی بر پایهٔ توصیف و تصاویر پژوهش؛ فاقد مقیاس و فاقد ابعاد برداشت‌شده</text>

<!-- PLAN -->
<rect class="panel" x="30" y="90" width="555" height="330" rx="8"/>
<text x="307" y="123" text-anchor="middle" direction="rtl" class="head">۱ ـ پلان ارتباط ایوان و تالار</text>
<rect x="115" y="155" width="385" height="82" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<text x="307" y="202" text-anchor="middle" direction="rtl" class="label">تالارِ پشت ایوان</text>
<rect x="145" y="237" width="325" height="110" fill="#f7f8f8" stroke="#20252b" stroke-width="1.5"/>
<line x1="145" y1="237" x2="470" y2="237" class="line"/>
<circle cx="195" cy="347" r="12" fill="#d6d3d1" stroke="#20252b" stroke-width="2"/>
<circle cx="420" cy="347" r="12" fill="#d6d3d1" stroke="#20252b" stroke-width="2"/>
<line x1="145" y1="237" x2="145" y2="347" class="line"/>
<line x1="470" y1="237" x2="470" y2="347" class="line"/>
<text x="307" y="285" text-anchor="middle" direction="rtl" class="label">فضای سرپوشیدهٔ ایوان</text>
<text x="195" y="375" text-anchor="middle" direction="rtl" class="small">ستون ۱</text>
<text x="420" y="375" text-anchor="middle" direction="rtl" class="small">ستون ۲</text>
<path d="M307 350 V400" class="arrow"/>
<text x="307" y="414" text-anchor="middle" direction="rtl" class="small">جبههٔ باز به حیاط مرکزی</text>

<!-- ELEVATION -->
<rect class="panel" x="615" y="90" width="555" height="330" rx="8"/>
<text x="892" y="123" text-anchor="middle" direction="rtl" class="head">۲ ـ نمای روبه‌حیاط؛ سقف تخت و دو ستون</text>
<line x1="690" y1="365" x2="1095" y2="365" class="line"/>
<rect x="740" y="175" width="310" height="28" fill="#d6d3d1" stroke="#20252b" stroke-width="2.3"/>
<rect x="780" y="203" width="22" height="162" fill="#e7e5df" stroke="#20252b" stroke-width="2"/>
<rect x="988" y="203" width="22" height="162" fill="#e7e5df" stroke="#20252b" stroke-width="2"/>
<rect x="840" y="232" width="110" height="100" fill="#d9e7ee" stroke="#64748b" stroke-width="1.2"/>
<path d="M840 232 V332 M895 232 V332 M950 232 V332 M840 282 H950" class="thin"/>
<text x="895" y="155" text-anchor="middle" direction="rtl" class="label">پوشش تخت / سقف افقی</text>
<path d="M895 160 V172" class="arrow"/>
<text x="790" y="390" text-anchor="middle" direction="rtl" class="small">ستون چپ</text>
<text x="999" y="390" text-anchor="middle" direction="rtl" class="small">ستون راست</text>
<text x="895" y="412" text-anchor="middle" direction="rtl" class="small">این نمونهٔ خاص، قوس ورودیِ گونهٔ طاق‌دار را ندارد.</text>

<!-- SECTION -->
<rect class="panel" x="30" y="440" width="555" height="335" rx="8"/>
<text x="307" y="473" text-anchor="middle" direction="rtl" class="head">۳ ـ مقطع طولی از حیاط به تالار</text>
<line x1="95" y1="710" x2="520" y2="710" class="line"/>
<!-- flat roof -->
<rect x="150" y="540" width="285" height="24" fill="#d6d3d1" stroke="#20252b" stroke-width="2"/>
<!-- two front columns schematic -->
<rect x="170" y="564" width="20" height="146" fill="#e7e5df" stroke="#20252b" stroke-width="2"/>
<!-- back room wall & opening -->
<rect x="435" y="564" width="35" height="146" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<rect x="270" y="605" width="125" height="105" fill="#d9e7ee" stroke="#64748b" stroke-width="1.5"/>
<text x="330" y="665" text-anchor="middle" direction="rtl" class="label">تالار در پشت</text>
<text x="285" y="590" text-anchor="middle" direction="rtl" class="small">ارتباط به تالار</text>
<path d="M125 635 H160" class="arrow"/>
<text x="125" y="617" text-anchor="middle" direction="rtl" class="small">حیاط</text>
<text x="295" y="525" text-anchor="middle" direction="rtl" class="small">پوشش افقی ایوان</text>
<text x="180" y="735" text-anchor="middle" direction="rtl" class="small">ستون در جبههٔ باز</text>
<text x="307" y="758" text-anchor="middle" direction="rtl" class="small">ترسیم مفهومیِ رابطهٔ ایوان، ستون و تالار؛ نه برداشت اجرایی.</text>

<!-- AXONOMETRIC -->
<rect class="panel" x="615" y="440" width="555" height="335" rx="8"/>
<text x="892" y="473" text-anchor="middle" direction="rtl" class="head">۴ ـ آکسونومتری؛ فضای تخت‌پوشِ باز به حیاط</text>
<!-- floor -->
<polygon points="710,650 885,720 1090,625 915,555" fill="#f5f5f3" stroke="#20252b" stroke-width="2"/>
<!-- back talar block -->
<polygon points="915,555 1090,625 1090,495 915,425" fill="url(#wall)" stroke="#20252b" stroke-width="2"/>
<!-- side edges/walls -->
<polygon points="710,650 915,555 915,425 710,520" fill="#e7e5df" stroke="#20252b" stroke-width="2"/>
<polygon points="885,720 1090,625 1090,495 885,590" fill="#e7e5df" stroke="#20252b" stroke-width="2"/>
<!-- flat canopy plate -->
<polygon points="690,535 885,455 1110,555 915,635" fill="#d6d3d1" stroke="#20252b" stroke-width="2.5"/>
<!-- two support columns at open edge -->
<polygon points="730,640 748,633 748,520 730,527" fill="#d9e7ee" stroke="#20252b" stroke-width="2"/>
<polygon points="870,698 888,690 888,577 870,585" fill="#d9e7ee" stroke="#20252b" stroke-width="2"/>
<text x="795" y="505" text-anchor="middle" direction="rtl" class="small">پوشش تخت</text>
<text x="1010" y="470" text-anchor="middle" direction="rtl" class="small">فضای تالار در پشت</text>
<text x="800" y="742" text-anchor="middle" direction="rtl" class="small">ستون‌ها در جبههٔ رو به حیاط</text>
<text x="1018" y="690" text-anchor="middle" direction="rtl" class="small">فضای سرپوشیدهٔ نیمه‌باز</text>
<line x1="35" y1="795" x2="1165" y2="795" stroke="#c7cbd0"/>
<text x="600" y="817" text-anchor="middle" direction="rtl" class="small">مبنای توصیف: مطالعهٔ خانهٔ منطق‌نژاد شیراز؛ مقاله ابعاد برداشت‌شدهٔ این صفحه را منتشر نکرده است.</text>
<text x="600" y="837" text-anchor="middle" class="small">Shaeri, Yaghoubi & Habibi, Buildings 8(6), 81 (2018), DOI: 10.3390/buildings8060081</text>
</svg>