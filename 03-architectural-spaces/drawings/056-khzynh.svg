<svg xmlns="http://www.w3.org/2000/svg" width="640" height="430" viewBox="0 0 640 430" role="img" aria-labelledby="ttl dsc">
<title id="ttl">خزینه — ترسیم شماتیک</title>
<desc id="dsc">دیاگرام آموزشی خزینه در معماری سنتی ایران. این ترسیم شماتیک عمومی است، مقیاس ندارد و به بنای تاریخی مشخصی منتسب نیست.</desc>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 8 L8 0" stroke="#9ca3af" stroke-width=".8"/></pattern></defs><rect width="640" height="430" fill="#fff"/>
<text x="320" y="34" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="21" font-weight="600" fill="#20252b">خزینه</text>
<line x1="44" y1="48" x2="596" y2="48" stroke="#d1d5db"/>
<rect x="105" y="90" width="430" height="260" rx="0" fill="#fff" stroke="#252525" stroke-width="2"/><rect x="130" y="115" width="155" height="100" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="1.4"/><rect x="355" y="115" width="155" height="100" rx="0" fill="#e7e5df" stroke="#252525" stroke-width="1.4"/><rect x="235" y="235" width="170" height="80" rx="0" fill="#c8e1ed" stroke="#252525" stroke-width="1.5"/><text x="320" y="280" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="15" text-anchor="middle" direction="rtl" fill="#252525">خزینه / آب</text>
<line x1="44" y1="390" x2="596" y2="390" stroke="#d1d5db"/>
<text x="320" y="414" text-anchor="middle" direction="rtl" font-family="Vazirmatn, Noto Sans Arabic, sans-serif" font-size="12" fill="#64748b">شماتیک آموزشی • فاقد مقیاس • گونهٔ عمومی</text>
</svg>